# Arma el APK de Tempo (app de Android que abre tu sitio a pantalla completa, con avisos propios).
# Se corre a mano desde GitHub → Actions → "APK de Tempo" → Run workflow, o solo cuando cambia android/.
# Firma con la llave guardada en los secrets ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASS.
# Deja el APK en Releases: https://github.com/diego29/entreno/releases/latest/download/tempo.apk
name: APK de Tempo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Preparar Bubblewrap
        run: |
          npm i -g @bubblewrap/cli@1.23.0
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # Bubblewrap busca la carpeta "tools" de los SDK viejos
          [ -e "$ANDROID_HOME/tools" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools"
      - name: Llave de firma
        working-directory: android
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > tempo.keystore
            echo "SIGNED=1" >> $GITHUB_ENV
          else
            echo "::warning::Faltan los secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS: armo un APK de prueba con una llave temporal (se verá con barra de dirección)."
            KS_PASS=prueba123
            keytool -genkeypair -keystore tempo.keystore -storetype PKCS12 -alias tempo -keyalg RSA -keysize 2048 -validity 365 -storepass $KS_PASS -keypass $KS_PASS -dname "CN=Prueba"
            echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV
            echo "SIGNED=0" >> $GITHUB_ENV
          fi
      - name: Generar proyecto y compilar
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest ./twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json
          ls -la *.apk
          cp app-release-signed.apk tempo.apk
      - uses: actions/upload-artifact@v4
        with: { name: tempo-apk, path: android/tempo.apk }
      - name: Publicar en Releases
        if: env.SIGNED == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete tempo-apk -y --cleanup-tag 2>/dev/null || true
          gh release create tempo-apk android/tempo.apk -t "Tempo para Android" -n "APK de Tempo, versión $(jq -r .appVersionName android/twa-manifest.json). Instálalo en tu Android (permite instalar apps de origen desconocido)." --latest
