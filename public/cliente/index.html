.ic.green{background:color-mix(in srgb,#2E9A5A 16%,var(--surface));color:#2E9A5A}.ic.amber{background:color-mix(in srgb,#C08415 18%,var(--surface));color:#C08415}
.pchips{display:flex;gap:6px;flex-wrap:wrap}.pchips button{height:32px;padding:0 12px;border-radius:999px;border:0;font:600 12.5px var(--body);background:rgba(255,255,255,.18);color:#fff}
.pchips button.on{background:#fff;color:#B3271A}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;color:var(--ink);font:inherit}
.excard .eh{display:flex;gap:12px;align-items:flex-start}.excard .eh .ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center}

<style>
/* Layout: app móvil del entrenado; 3 pestañas abajo (Hoy, Semana, Progreso); el entrenamiento ocupa toda la pantalla */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface2:#F6F7F9; --ink:#15181E; --muted:#5E6573; --line:#D9DDE3;
  --accent:#D63A2B; --accent-ink:#FFFFFF; --accent-soft:#FBE4E1; --ok:#23834A; --warn:#B7791F; --on-feel:#FFFFFF; --mat:#FFFFFF;
  --hero:#15181E; --hero-ink:#FFFFFF;
  --bar:#7B818C; --sleeve:#A9AEB7; --frame:#C9CDD4;
  --p45:#2F5FB3; --p35:#E0B12E; --p25:#2E8B57; --p10:#3A3F48; --p5:#6E7581; --p2:#C4C8CE;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1A1D24; --surface2:#21252D; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2E333C;
  --accent:#F0533F; --accent-ink:#FFFFFF; --accent-soft:#3A1D1A; --ok:#4FC07C; --warn:#E3AA4C; --on-feel:#111318; --mat:#ECECEE;
  --hero:#23272F; --hero-ink:#FFFFFF; --bar:#8E95A1; --sleeve:#5F6672; --frame:#3C424C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1A1D24; --surface2:#21252D; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2E333C;
  --accent:#F0533F; --accent-ink:#FFFFFF; --accent-soft:#3A1D1A; --ok:#4FC07C; --warn:#E3AA4C; --on-feel:#111318; --mat:#ECECEE;
  --hero:#23272F; --hero-ink:#FFFFFF; --bar:#8E95A1; --sleeve:#5F6672; --frame:#3C424C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;padding-block:12px 100px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}
h1{font-size:34px;font-weight:800}h2{font-size:24px;font-weight:700}h3{font-size:19px;font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.preview{font-size:12px;color:var(--muted);text-align:center;padding-block:2px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 14px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:800;font-size:20px;border:0;flex:none}
/* Hoy */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-ink);opacity:.65}
.hero h2{font-size:44px;font-weight:800}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.85}
.hero .meta b{font-family:var(--display);font-size:20px;margin-right:3px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.thumbs img,.thumbs .noimg{width:58px;height:58px;flex:none;border-radius:10px;background:var(--mat);object-fit:contain}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:15px;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.go svg{width:18px;height:18px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted)}
.wd b{font-family:var(--display);font-size:17px;color:var(--ink)}
.wd i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);font-style:normal}
.wd.plan i{border-color:var(--muted)}
.wd.done i{border:0;background:var(--ok);color:var(--on-feel)}
.wd.done i svg{width:12px;height:12px}
.wd.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.note-card{border-left:0;display:flex;gap:12px;align-items:flex-start}
.note-card .avatar{width:36px;height:36px;font-size:17px;background:var(--hero);color:var(--hero-ink)}
.quote{font-size:15px;line-height:1.5}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.stats3 small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats3 b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stats3 span{font-size:12px;color:var(--muted)}
/* Semana */
.dayrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.dayrow .dn{width:46px;flex:none;text-align:center}
.dayrow .dn b{display:block;font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.dayrow .dn small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dayrow.rest{background:transparent;border-style:dashed}
.state{font-size:12px;font-weight:700}
.state.ok{color:var(--ok)}
.exlist{display:flex;flex-direction:column;gap:8px}
.exitem{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.exitem img,.exitem .noimg{width:56px;height:56px;flex:none;border-radius:9px;background:var(--mat);object-fit:contain}
.exitem .nm{font-weight:700;font-size:14px}
.exitem .ds{font-family:var(--display);font-size:17px;font-weight:700}
.ssbox{border:1.5px solid var(--accent);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.ssbox>b{font-family:var(--display);text-transform:uppercase;color:var(--accent);font-size:15px;letter-spacing:.05em;padding:2px 6px 0}
.ssbox .exitem{border-color:transparent}
.noimg{display:grid;place-items:center;color:var(--muted);background:var(--surface2)}
.noimg svg{width:20px;height:20px;opacity:.6}
/* Progreso */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.name{font-weight:700;font-size:15px}
.sub{font-size:13px;color:var(--muted)}
.spark{width:84px;height:30px;flex:none}
.delta{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.delta.up{color:var(--ok)}.delta.down{color:var(--accent)}
.chartbox{position:relative;margin-top:8px;min-height:220px;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;max-width:220px}
.tip b{font-family:var(--display);font-size:18px}.tip span{font-size:12px;opacity:.85}
.pr{display:flex;gap:10px;align-items:center}
.pr .medal{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

/* Historial de ejemplo: 6 semanas con progresión */
const TODAY=new Date();TODAY.setHours(12,0,0,0);

let LOGS=[],SESSIONS=[];
let UNIT={};function rebuildUnits(){UNIT={};Object.values(WEEK).forEach(d=>d.ex.forEach(e=>UNIT[exKey(e.name)]=uOf(e)));LOGS.forEach(l=>{const k=exKey(l.exName);if(!UNIT[k]){const u=l.sets?.at(-1)?.unit;if(u)UNIT[k]=u}})}const uN=n=>UNIT[exKey(n)]||"kg";
const S={tab:"hoy",progEx:null,progMetric:"maxW",weekSel:null,progGroup:"Todos"};

const TILEI={chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>',

/* v60: el reloj con los ceros que sobran tenues (01:28 → 0 tenue + 1:28) */
function mmssDim(s){const x=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");let i=0;while(i<x.length-1&&(x[i]==="0"||x[i]===":"))i++;
  return `<span><span class="tdim">${x.slice(0,i)}</span>${x.slice(i)}</span>`}
/* v62: apariencia (automático / claro / oscuro), guardada en este teléfono */
const THEME_KEY="entreno-theme-c";
function themeGet(){try{const v=localStorage.getItem(THEME_KEY);return v==="light"||v==="dark"?v:"auto"}catch(e){return"auto"}}
function themeApply(v){const r=document.documentElement;if(v==="light"||v==="dark")r.dataset.theme=v;else delete r.dataset.theme;
  const dark=v==="dark"||(v!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#111318":"#D63A2B"}
function themeCard(){const v=themeGet();return `<div class="card stack" id="theme-card"><div class="eyebrow">Apariencia</div><div class="seg">${[["auto","Automático"],["light","Claro"],["dark","Oscuro"]].map(([k,l])=>`<button class="${k===v?"on":""}" data-themeset="${k}">${l}</button>`).join("")}</div><div class="sub" style="white-space:normal">${v==="auto"?"Sigue el modo claro u oscuro de tu teléfono.":v==="dark"?"Siempre en modo oscuro.":"Siempre en modo claro."}</div></div>`}
try{themeApply(themeGet())}catch(e){}
document.addEventListener("click",e=>{const b=e.target.closest("[data-themeset]");if(!b)return;const v=b.dataset.themeset;try{v==="auto"?localStorage.removeItem(THEME_KEY):localStorage.setItem(THEME_KEY,v)}catch(x){}themeApply(v);const c=$("#theme-card");if(c)c.outerHTML=themeCard()});
/* ===== Pantallas ===== */
function nextWorkout(){
  for(let i=0;i<7;i++){const d=new Date(TODAY);d.setDate(TODAY.getDate()+i);const k=dayKeyOf(d);
    if(WEEK[k]&&!SESSIONS.some(s=>s.date===iso(d)))return{k,date:iso(d),i}}
  return null;
}
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===S.tab));
  const y=window.scrollY;
  $("#app").innerHTML=(navigator.onLine?"":`<div class="preview">Sin internet: tu entreno se guarda y se envía al reconectar</div>`)+liveBannerHTML()+(S.tab==="hoy"&&!P?notifBanner():"")+(S.tab==="hoy"?viewHoy():S.tab==="semana"?viewSemana():viewProgreso());
  drawChart();window.scrollTo(0,y);
  const vk=S.tab+"|"+(S.progEx||"");if(vk!==ANIMV){ANIMV=vk;[...$("#app").children].forEach((c,i)=>{c.classList.add("rise");c.style.animationDelay=Math.min(i,4)*0.03+"s"})}
}
let ANIMV="";
function weekStrip(){
  return `<div class="weekstrip">${DAYS.map(([k,l],i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);const date=iso(d);
    const done=SESSIONS.some(s=>s.date===date),plan=!!WEEK[k],today=date===iso(TODAY);
    return `<div class="wd ${done?"done":plan?"plan":""} ${today?"today":""}"><b>${l}</b><i>${done?ICON.check:""}</i><span>${d.getDate()}</span></div>`}).join("")}</div>`;
}
function estMin(d){return Math.round(d.ex.reduce((a,e)=>a+e.sets*(0.75+(e.rest||0)/60),0)+5)}
/* v60: semana dentro de la tarjeta, progreso del mes y menú con mosaicos */
function heroWeek(done,planned){
  const dots=DAYS.map(([k,l],i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);const date=iso(d);
    const ok=SESSIONS.some(s=>s.date===date),plan=!!WEEK[k],today=date===iso(TODAY);

  return `<div class="hweek"><div><div class="cnt">${done}<small>/${planned} días</small></div><div class="cntl">esta semana</div></div><div class="hdots" aria-label="Días de esta semana">${dots}</div></div>`}
function monthCard(){const m0=iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)),m1=iso(new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0));
  const done=SESSIONS.filter(s=>s.date>=m0&&s.date<=m1).length;let plan=0;
  for(let d=new Date(m0+"T12:00");iso(d)<=m1;d.setDate(d.getDate()+1))if(WEEK[dayKeyOf(d)])plan++;
  if(!plan&&!done)return"";const pct=Math.min(100,Math.round(done/Math.max(1,plan)*100));
  const prs=recentPRs().filter(p=>p.date>=m0);const best=prs.slice().sort((a,b)=>(b.w-b.prev)-(a.w-a.prev))[0];
  return `<div class="mcard"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-size:13px">Tu progreso del mes</b><span class="muted" style="font-size:12px">${done} de ${plan} rutinas</span></div>

function homeTiles(){const n=[...new Set(LOGS.map(l=>exKey(l.exName)))].length;const wk=Object.keys(WEEK).length;

  return `<div class="tiles">${tile('data-tab="progreso"',"red","chart","Progreso por ejercicio",n?`${n} ejercicios · récords y última vez`:"Aquí verás tus récords")}

function viewHoy(){
  const nx=nextWorkout();const thisWeek=SESSIONS.filter(s=>s.date>=iso(monday));

  {let ds=null;try{ds=deloadState(CLIENT,SESSIONS,planned,new Date())}catch(e){}
   if(ds?.on)h+=`<div class="dlbar" style="margin-bottom:12px">↻ <b>Esta semana es de recuperación</b>${ds.src==="auto"?` (${esc(ds.why)})`:""}: mismos ejercicios con 20% menos peso. Que todo se sienta Fácil.</div>`}
  if(!Object.keys(WEEK).length)h+=`<div class="hero"><div class="eyebrow">Tu plan</div><h2>Muy pronto</h2><p style="margin:0;opacity:.85">${esc(ME.trainer)} todavía no te asigna rutina. En cuanto lo haga aparecerá aquí.</p></div>`;
  if(P&&P.paused)h+=pausedHTML(true);
  else if(nx){const d=WEEK[nx.k];const isToday=nx.i===0;const dn=DAYS.find(x=>x[0]===nx.k)[2];
    h+=`<div class="hero red"><div class="eyebrow">${isToday?"RUTINA DE HOY":`PRÓXIMO ENTRENO · ${nx.i===1?"MAÑANA":dn.toUpperCase()}`}</div>
      <div><h2>${esc(d.title)}</h2><div class="hsub">${d.ex.length} ejercicios · ${d.ex.reduce((a,e)=>a+e.sets,0)} series · ${esc(ME.trainer)}</div></div>
      <div class="hchips">${ME.goal?`<span>${esc(ME.goal)}</span>`:""}<span>~${estMin(d)} min</span>${d.cardio?`<span>+ ${esc(d.cardio.min)} min ${esc((d.cardio.machine||"cardio").toLowerCase())}</span>`:""}</div>

  if(!nx||(P&&P.paused))h+=`<div class="row" style="justify-content:space-between;margin:20px 0 8px"><div class="eyebrow">Esta semana</div><span class="muted" style="font-size:13px">${thisWeek.length} de ${planned} entrenos</span></div>${weekStrip()}`;

    tip.style.left=Math.min(Math.max(0,xy[i][0]-tip.offsetWidth/2),W-tip.offsetWidth)+"px";tip.style.top=Math.max(0,xy[i][1]-tip.offsetHeight-12)+"px"};

const PL={45:{c:"var(--p45)",t:"#fff",w:17,h:96,b:58},35:{c:"var(--p35)",t:"#1a1a1a",w:15,h:86,b:54},25:{c:"var(--p25)",t:"#fff",w:13,h:74,b:50},
  10:{c:"var(--p10)",t:"#fff",w:10,h:56,b:44},5:{c:"var(--p5)",t:"#fff",w:8,h:44,b:40},2.5:{c:"var(--p2)",t:"#1a1a1a",w:7,h:34,b:36}};
const BARS=[[45,"Barra 45"],[35,"Barra 35"],[25,"Barra Z 25"],[0,"Sin barra"]];
function multOf(e){return e.load==="plates1"?1:2}
function greedyPlates(totalLb,bar,mult){let side=(totalLb-bar)/mult;const out=[];if(!(side>0))return out;
  for(const w of PLATES){while(side>=w-0.01&&out.length<12){out.push(w);side-=w}}return out}
function plateTotal(p,ei){const e=p.ex[ei];return(p.bars[ei]||0)+(p.plates[ei]||[]).reduce((a,b)=>a+b,0)*multOf(e)}
function plateBreak(p,ei){const e=p.ex[ei],pl=p.plates[ei]||[];const cnt={};pl.forEach(w=>cnt[w]=(cnt[w]||0)+1);
  const parts=PLATES.filter(w=>cnt[w]).map(w=>`${cnt[w]}×${w}`);
  const side=parts.length?parts.join(" + "):"sin discos";
  return (p.bars[ei]?`Barra ${p.bars[ei]} + `:"")+(multOf(e)===2?`(${side}) ${e.load==="hammer"?"por brazo":"por lado"}`:`${side} de un lado`)}
const NO_BAR=l=>l==="smith"||l==="hammer";
function barSVG(p,ei){
  const e=p.ex[ei],pl=p.plates[ei]||[],type=e.load||"plates2";
  const W=360,H=type==="smith"||type==="hammer"?160:110;
  /* discos: start = borde del collarín, dir = hacia afuera, sc = escala de altura */
  const rects=(start,dir,cy,room,sc)=>{const need=pl.reduce((a,w)=>a+PL[w].w+2,0);const k=need>room?room/need:1;let x=start,out="";
    pl.forEach((w,i)=>{const P=PL[w],pw=Math.max(4,P.w*k),ph=P.h*sc;const rx=dir>0?x:x-pw;
      out+=`<g data-rmplate="${i}" style="cursor:pointer"><rect x="${rx}" y="${cy-ph/2}" width="${pw}" height="${ph}" rx="2.5" fill="${P.c}" stroke="var(--surface)" stroke-width="1"/>
      ${pw>=11&&ph>=40?`<text x="${rx+pw/2}" y="${cy}" fill="${P.t}" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 ${rx+pw/2} ${cy})">${w}</text>`:""}</g>`;x+=dir*(pw+2)});return out};
  const barbell=cy=>`<rect x="6" y="${cy-4}" width="${W-12}" height="8" rx="3" fill="var(--bar)"/>
    <rect x="8" y="${cy-7}" width="112" height="14" rx="3" fill="var(--sleeve)"/><rect x="240" y="${cy-7}" width="112" height="14" rx="3" fill="var(--sleeve)"/>
    <rect x="120" y="${cy-13}" width="6" height="26" rx="2" fill="var(--bar)"/><rect x="234" y="${cy-13}" width="6" height="26" rx="2" fill="var(--bar)"/>`;
  let g="";
  if(type==="smith"){const cy=78;
    /* marco: base, dos rieles verticales, travesaño; la barra corre por los rieles con sus ganchos */
    g+=`<rect x="96" y="150" width="168" height="5" rx="2" fill="var(--frame)"/><rect x="88" y="146" width="22" height="9" rx="2" fill="var(--frame)"/><rect x="250" y="146" width="22" height="9" rx="2" fill="var(--frame)"/>
      <rect x="128" y="10" width="104" height="6" rx="2" fill="var(--frame)"/>
      <rect x="138" y="10" width="5" height="142" rx="2" fill="var(--frame)"/><rect x="217" y="10" width="5" height="142" rx="2" fill="var(--frame)"/>`;
    g+=barbell(cy)+`<rect x="133" y="${cy-12}" width="15" height="24" rx="3" fill="var(--bar)"/><rect x="212" y="${cy-12}" width="15" height="24" rx="3" fill="var(--bar)"/>
      <path d="M148 ${cy+2}h6v8" stroke="var(--bar)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M212 ${cy+2}h-6v8" stroke="var(--bar)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    g+=rects(117,-1,cy,104,1)+rects(243,1,cy,104,1);
  }else if(type==="hammer"){
    /* dos brazos paralelos: pivote a la izquierda, agarre, y el cuerno donde van los discos */
    [44,116].forEach((cy,j)=>{
      g+=`<circle cx="26" cy="${cy}" r="9" fill="none" stroke="var(--frame)" stroke-width="4"/><circle cx="26" cy="${cy}" r="3" fill="var(--frame)"/>
        <rect x="34" y="${cy-5}" width="160" height="10" rx="4" fill="var(--bar)"/>
        <rect x="96" y="${cy-18}" width="7" height="22" rx="3" fill="var(--sleeve)"/>
        <rect x="200" y="${cy-6}" width="150" height="12" rx="3" fill="var(--sleeve)"/><rect x="194" y="${cy-12}" width="6" height="24" rx="2" fill="var(--bar)"/>
        <text x="48" y="${cy-12}" font-size="10" fill="var(--muted)">${j?"brazo der.":"brazo izq."}</text>`;
      g+=rects(203,1,cy,144,.64);});
  }else if(type==="plates1"){const cy=55;
    g+=`<rect x="6" y="${cy-4}" width="${W-12}" height="8" rx="3" fill="var(--bar)"/><rect x="186" y="${cy-7}" width="166" height="14" rx="3" fill="var(--sleeve)"/><rect x="180" y="${cy-13}" width="6" height="26" rx="2" fill="var(--bar)"/>
      <rect x="20" y="${cy-14}" width="10" height="28" rx="3" fill="var(--bar)"/><text x="40" y="${cy-18}" font-size="10" fill="var(--muted)">anclaje</text>`+rects(189,1,cy,158,1);
  }else{const cy=55;
    g+=barbell(cy)+`<rect x="150" y="${cy-4}" width="60" height="8" fill="url(#knurl)"/>`+rects(117,-1,cy,104,1)+rects(243,1,cy,104,1);
  }
  return `<svg class="barsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(plateBreak(p,ei))}"><defs><pattern id="knurl" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="var(--sleeve)" stroke-width="1"/></pattern></defs>${g}</svg>`;
}
function loaderHTML(p,ei){
  const e=p.ex[ei],two=multOf(e)===2,pl=p.plates[ei]||[];
  return `<div class="card loader">
    <div class="row" style="justify-content:space-between;gap:8px"><div class="eyebrow">${({plates2:"Barra libre · se replica del otro lado",smith:"Smith · se replica del otro lado",hammer:"Máquina tipo Hammer · se replica en el otro brazo",plates1:"Remo T / landmine · discos de un solo lado"})[e.load]||"Discos"}</div>
      <button class="btn ghost" id="pl-undo" ${pl.length?"":"disabled"}>Quitar último</button></div>
    ${barSVG(p,ei)}
    <div class="plates">${PLATES.map(w=>`<button class="pbtn" data-plate="${w}" style="--pc:${PL[w].c};--pt:${PL[w].t};--ps:${PL[w].b}px" aria-label="Agregar disco de ${w} lb">${w}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">

      <button class="btn ghost" id="pl-clear" ${pl.length?"":"disabled"}>Vaciar</button></div>
    <div class="muted" style="font-size:13px">${esc(plateBreak(p,ei))}. Toca un disco en la barra para quitarlo.</div></div>`;
}
/* ===== Máquinas con peso máximo: al llegar al tope se suman discos extra en el cuerno/pin (un solo punto de carga) ===== */
function xpTotal(e,arr){return Math.round((num(e.maxW)+(arr||[]).reduce((a,b)=>a+b,0))*10)/10}
function xpBoxHTML(e,arr){const t=xpTotal(e,arr);return `<div class="stepper"><label>Peso total</label><div class="totbig">${fmtN(t)}<small>lb</small></div><input type="hidden" id="in-w" value="${t}"></div>`}
function xpPanelHTML(e,arr){const MX=num(e.maxW);
  return `<div class="card loader xp"><div class="row" style="justify-content:space-between;gap:8px"><div class="eyebrow">Máquina al máximo · discos extra</div><button class="btn ghost" id="xp-undo" ${arr.length?"":"disabled"}>Quitar último</button></div>
    <div class="xpline"><span class="xpbase">Máquina ${fmtN(MX)} lb</span>${arr.map(w=>`<span class="xpd" style="--pc:${PL[w].c};--pt:${PL[w].t}">+${w}</span>`).join("")}<b>= ${fmtN(xpTotal(e,arr))} lb</b></div>
    <div class="plates">${PLATES.map(w=>`<button class="pbtn" data-xpl="${w}" style="--pc:${PL[w].c};--pt:${PL[w].t};--ps:${PL[w].b}px" aria-label="Agregar disco de ${w} lb">${w}</button>`).join("")}</div>
    <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="muted" style="font-size:13px">Los discos van en el cuerno o pin de la máquina, encima de las ${fmtN(MX)} lb del stack.</span><button class="btn ghost" id="xp-off">Quitar discos extra</button></div></div>`}
function xpBtnHTML(e){return `<button class="btn block xpon" id="xp-on"><b>+</b> Llegó al máximo de la máquina (${fmtN(num(e.maxW))} lb): agregar discos</button>`}
function totalBoxHTML(p,ei){const t=plateTotal(p,ei);
  return `<div class="stepper"><label>Peso total</label><div class="totbig">${fmtN(t)}<small>lb</small></div>
    <input type="hidden" id="in-w" value="${t}"></div>`}

/* ===== Ilustración de mancuernas y barra de peso fijo ===== */
function eqLabel(w,u){return w?`${fmtN(w)} ${u}`:`— ${u}`}

  const c=120;
  return `<g transform="translate(0,${y})">

    <rect x="${c-74}" y="-17" width="12" height="34" rx="4" fill="var(--ink)" opacity=".8"/><rect x="${c+62}" y="-17" width="12" height="34" rx="4" fill="var(--ink)" opacity=".8"/>

function eqSVG(e,w,u){

      <rect x="14" y="${y-26}" width="22" height="52" rx="9" fill="var(--ink)"/><rect x="204" y="${y-26}" width="22" height="52" rx="9" fill="var(--ink)"/>
      ${bar}
      <rect x="${120-34}" y="${y-38}" width="68" height="24" rx="12" fill="var(--accent)"/>

      <text x="120" y="${y+34}" text-anchor="middle" font-family="Figtree,system-ui,sans-serif" font-weight="600" font-size="12" fill="var(--muted)">Barra ${z?"Z":"recta"} · peso fijo</text></svg>`}
  return ""}
function eqCaption(e){return e.equip==="db"?(e.uni?"Unilateral · 1 mancuerna":"Peso de cada mancuerna"):e.equip==="fixbar"?(e.barType==="z"?"Barra Z":"Barra recta"):""}
function eqBoxHTML(e,w,u){return e.equip?`<div class="eqbox" id="eqv" data-eqw="1"><div class="eqcap">${eqCaption(e)}</div>${eqSVG(e,w,u)}</div>`:""}
function refreshEq(e,u){const b=$("#eqv");const i=$("#in-w");if(!b||!i||!e?.equip)return;b.innerHTML=`<div class="eqcap">${eqCaption(e)}</div>${eqSVG(e,num(i.value),u)}`}

function redrawKeep(){const r=$("#in-r")?.value;draw();if(r!=null&&$("#in-r"))$("#in-r").value=r}
let P=null,tick=null,bursting=false;
function groupsOf(ex){const g=[];let cur=[];ex.forEach((e,i)=>{cur.push(i);if(!e.ss||i===ex.length-1){g.push(cur);cur=[]}});return g}
function buildPlan(ex){const plan=[];groupsOf(ex).forEach((g,gi)=>{const r=Math.max(...g.map(i=>ex[i].sets));for(let s=0;s<r;s++)g.forEach(i=>{if(s<ex[i].sets)plan.push({ei:i,si:s,g:gi})})});return plan}
/* ===== Progreso automático =====
   Si una serie se marca "Fácil" y llega a las reps meta (lo más alto del rango, o lo que defina el entrenador), sube el peso:
   en la siguiente serie si quedan, o desde la primera serie de la próxima sesión. Queda registrado en la sesión para el aviso en Tempo. */
const UPSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
function repTop(r){const s=String(r||"").toLowerCase();if(/\d\s*(s|seg|segundos|min|minutos)\b/.test(s))return 0;const n=(s.match(/\d+/g)||[]).map(Number);return n.length?Math.max(...n):0}
function progAt(e){return parseInt(e.progAt,10)||repTop(e.reps)}
function progInc(e){const v=num(e.progInc);return v>0?v:e.load==="plates1"?5:e.load?10:5}
function wLb(r){return r?num(r.w??String(r.weight||"").match(/\d+(?:[.,]\d+)?/)?.[0]??0):0}
/* ===== Progresión v58: lo primordial es la SERIE ANTERIOR (misma lógica en Tempo y Reps) =====
   Dentro de la sesión, cada serie sale de cómo fue la serie anterior:
   · Menos de 6 reps → baja 20% y busca 10-12 (o el rango más alto si el tope del ejercicio es otro).
   · Entre 6 y la meta sin llegar → mismo peso; la meta pasa al rango donde cayó (7 → 6-8, 9 → 8-10).
   · Llegó al máximo de su rango en fácil/media → sube al siguiente rango (8-10 → 10-12) sin pasar del tope.
     En fácil, además, sube el peso (como antes). En difícil se repite el rango.
   · Llegó al tope (12 o el del ejercicio) → la siguiente serie se mantiene (en fácil sube el peso).
   · Energía baja o descarga: nada sube; sí puede bajar.
   Siguiente sesión: la serie 1 arranca con la serie MÁS PESADA de la vez pasada (empate: la de más reps) y se le aplican
   las mismas reglas; si esa serie llegó al tope, sube el peso según la dificultad (fácil → 10-12, media → 8-10,
   difícil → por edad: <40 6-8, 40-49 8-10, 50+ repite).
   La comparación serie contra serie de la sesión pasada solo se usa en el resumen. */
const FEELRANK={facil:0,media:1,dificil:2};
function parseRange(r){const s=String(r??"").toLowerCase();if(/\d\s*(s|seg|segundos|min|minutos)\b/.test(s))return null;
  const n=(s.match(/\d+/g)||[]).map(Number).slice(0,2);if(!n.length)return null;return{lo:Math.min(...n),hi:Math.max(...n)}}
const rStr=r=>r.lo===r.hi?String(r.hi):r.lo+"-"+r.hi;
function capOf(e){const b=parseRange(e.reps);return parseInt(e.progAt,10)||Math.max(12,b?b.hi:12)}
function ageGroup(age){const a=parseInt(age,10);if(!a)return"50";return a<40?"joven":a<50?"40":"50"}
const roundDl=w=>Math.max(0,Math.round(w*0.8/5)*5);
const baseW=e=>num(String(e.weight??"").match(/\d+(?:[.,]\d+)?/)?.[0]||0);
const LOWREPS=6,DROP=.8;
function roundStep(w,e){const st=progInc(e)||5;return Math.max(st,Math.round(w/st)*st)}
const dropW=(w,e)=>w>0?Math.min(w-(progInc(e)||5),roundStep(w*DROP,e)):0;     // 20% menos, al paso de la máquina (y al menos un paso)
const topR=cap=>({lo:Math.max(1,cap-2),hi:cap});
function bandOf(rp,cap){let hi=Math.max(8,rp+(rp%2));hi=Math.min(hi,cap);return{lo:Math.max(LOWREPS,hi-2),hi}}   // 6-7 → 6-8 · 8 → 6-8 · 9 → 8-10
const feelOf=r=>FEEL[r?.feel]?r.feel:"media";
/* núcleo: de una serie hecha (r, con su meta r.tgt) a la siguiente {w, range, why, kind}
   o.same: dentro de la misma sesión · o.frozen: energía baja/descarga · o.age */
function nextFrom(e,r,o={}){
  const base=parseRange(e.reps);if(!base||!r)return null;
  const t=parseRange(r.tgt)||base,rp=num(r.reps),W=wLb(r),f=feelOf(r),cap=capOf(e),inc=progInc(e),fl=FEEL[f].t.toLowerCase(),wt=v=>fmtN(v)+" lb";
  const out=(w,range,why,kind)=>({w,range:typeof range==="string"?range:rStr(range),why,kind});
  if(rp<LOWREPS){if(W>0){const w=dropW(W,e);return out(w,topR(cap),`${rp} reps con ${wt(W)} → baja 20% a ${wt(w)}, meta ${rStr(topR(cap))}`,"baja")}
    return out(0,bandOf(LOWREPS,cap),`${rp} reps → meta ${rStr(bandOf(LOWREPS,cap))}`,"ajuste")}
  if(rp<t.lo){const b=bandOf(rp,cap);return out(W,b,`${rp} de ${rStr(t)} → mismo peso, meta ${rStr(b)}`,"ajuste")}
  if(o.frozen)return out(W,t,o.dl?"semana de recuperación → sin subir":"energía baja → nada sube, mantén "+rStr(t),"igual");
  if(rp>=cap&&t.hi>=cap){
    if(o.same)return f==="facil"&&W>0?out(W+inc,t,`${rp} en fácil → sube a ${wt(W+inc)}`,"peso"):out(W,t,`${rp} reps → se mantiene`,"igual");
    if(f==="facil")return out(W+inc,topR(cap),`${rp} en fácil con ${wt(W)} → ${wt(W+inc)}, meta ${rStr(topR(cap))}`,"peso");
    if(f==="media")return out(W+inc,{lo:cap-4,hi:cap-2},`${rp} en media con ${wt(W)} → ${wt(W+inc)}, meta ${cap-4}-${cap-2}`,"peso");
    const g=ageGroup(o.age);
    if(g==="joven")return out(W+inc,{lo:cap-6,hi:cap-4},`${rp} en difícil (menor de 40) → ${wt(W+inc)}, meta ${cap-6}-${cap-4}`,"peso");
    if(g==="40")return out(W+inc,{lo:cap-4,hi:cap-2},`${rp} en difícil (40-49) → ${wt(W+inc)}, meta ${cap-4}-${cap-2}`,"peso");
    return out(W,t,`${rp} en difícil → repite ${wt(W)} para afianzarlo`,"igual")}
  if(rp>=t.hi){
    if(f==="dificil")return out(W,t,`${rp} pero difícil → repite ${rStr(t)}`,"igual");
    if(o.same&&f==="facil"&&W>0)return out(W+inc,t,`${rp} en fácil → sube a ${wt(W+inc)}`,"peso");
    const st=Math.max(2,t.hi-t.lo);let lo=t.hi,hi=t.hi+st;if(hi>cap){hi=cap;lo=Math.max(1,cap-st)}
    return hi>t.hi?out(W,{lo,hi},`${rp} en ${fl} → meta ${lo}-${hi}`,"rango"):out(W,t,`${rp} reps → se mantiene`,"igual")}
  return out(W,t,`${rp} de ${rStr(t)} → mismo peso, busca ${t.hi}`,"igual")}
/* la serie de referencia de una sesión: la más pesada (empate: la de más reps) */
function refSet(sets){let b=null;(sets||[]).forEach(s=>{if(!s)return;if(!b||wLb(s)>wLb(b)+.01||(Math.abs(wLb(s)-wLb(b))<.01&&num(s.reps)>num(b.reps)))b=s});return b}
/* plan de la serie 1 de la próxima sesión; ranges trae la meta de la serie 1 repetida (las demás se ajustan en vivo) */
function planFor(e,ctx){
  const base=parseRange(e.reps),n=Math.max(1,parseInt(e.sets,10)||1),pw=baseW(e);
  const out=(w,range,why,kind)=>({w,ranges:Array(n).fill(range),why,kind,whys:[why]});
  const def=out(pw,base?rStr(base):String(e.reps||""),"","rutina");
  const L=ctx.last,sets=(L?.sets||[]).filter(Boolean);
  const fresh=!base||num(e.tWork)>0||e.progOff||!sets.length||(L.base&&(num(L.base.w)!==pw||String(L.base.reps??"")!==String(e.reps??"")));
  if(fresh){if(ctx.deload&&pw)return out(roundDl(pw),def.ranges[0],"Semana de recuperación: 20% menos peso","descarga");
    if(sets.length&&L.base&&base&&!e.progOff&&!num(e.tWork))return{...def,why:"Tu entrenador ajustó esta rutina: arrancamos desde ahí",whys:["Tu entrenador ajustó esta rutina: arrancamos desde ahí"]};return def}
  const R=refSet(sets),rt=parseRange(R.tgt)||base,W=wLb(R);

  addEventListener("touchstart",e=>{const t=e.touches[0];ok=e.touches.length===1&&canSwipeBack()&&!scrollsX(e.target);x0=t.clientX;y0=t.clientY;t0=Date.now()},{passive:true});
