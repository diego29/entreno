<script>
(function(){

const key=new THREE.DirectionalLight(0xffffff,0.95);key.position.set(-2.5,4.5,3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-2.2,right:2.2,top:2.6,bottom:-1.5,near:.5,far:14});key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;scene.add(key);

const M={
  metal:new THREE.MeshStandardMaterial({color:0xb7bbc1,roughness:.35,metalness:.6}),
  dark:new THREE.MeshStandardMaterial({color:0x1c1c1c,roughness:.7}),
  plate:new THREE.MeshStandardMaterial({color:0x2a2b2d,roughness:.5,metalness:.3}),
  pad:new THREE.MeshStandardMaterial({color:0x3a3f48,roughness:.8}),

const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d),CY=(r,l,s)=>new THREE.CylinderGeometry(r,r,l,s||20);
const UPV=V(0,1,0);
function between(mesh,a,b){const d=b.clone().sub(a);mesh.position.copy(a).addScaledVector(d,.5);mesh.scale.set(1,d.length(),1);mesh.quaternion.setFromUnitVectors(UPV,d.normalize())}

/* ---------- personaje ---------- */
const G=new THREE.Group();scene.add(G);   // marco del cuerpo: posición y orientación de cada ejercicio
const SIDES=[['Right',-1],['Left',1]];
const FINGERS=['Index','Middle','Ring','Pinky'];
let C=null;const models={};
const nameOf=b=>b.name.replace(/^mixamorig:?/,'');
function buildModel(obj,height,only){   // only: músculos a pintar en este ejercicio (si no se pasa, todos)
  G.position.set(0,0,0);G.quaternion.identity();G.updateMatrixWorld(true);
  const root=obj;G.add(root);
  const meshes=[];root.traverse(o=>{if(o.isMesh){meshes.push(o);o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});
  root.updateMatrixWorld(true);
  const bx=new THREE.Box3();meshes.forEach(m=>bx.expandByObject(m));
  root.scale.multiplyScalar(height/(bx.max.y-bx.min.y));root.updateMatrixWorld(true);
  const b2=new THREE.Box3();meshes.forEach(m=>b2.expandByObject(m));
  root.position.y-=b2.min.y;root.position.x-=(b2.min.x+b2.max.x)/2;root.position.z-=(b2.min.z+b2.max.z)/2;root.updateMatrixWorld(true);
  const bones={};root.traverse(o=>{if(o.isBone&&!bones[nameOf(o)])bones[nameOf(o)]=o});   // el FBX duplica cada hueso por malla: el primero es el que mueve la jerarquía
  const need=['Hips','RightArm','RightForeArm','RightHand','LeftArm','LeftForeArm','LeftHand','RightUpLeg','RightLeg','RightFoot','RightToeBase','LeftUpLeg','LeftLeg','LeftFoot','LeftToeBase','RightHandMiddle1','LeftHandMiddle1'];
  need.forEach(n=>{if(!bones[n])throw new Error('falta hueso '+n)});
  const rest={};
  Object.entries(bones).forEach(([n,b])=>{rest[n]={p:b.getWorldPosition(new THREE.Vector3()),q:b.getWorldQuaternion(new THREE.Quaternion())}});
  const dirTo=(a,b)=>rest[b]?rest[b].p.clone().sub(rest[a].p).normalize():null;
  const chain={};
  SIDES.forEach(([s])=>{
    chain[s+'Arm']=dirTo(s+'Arm',s+'ForeArm');chain[s+'ForeArm']=dirTo(s+'ForeArm',s+'Hand');chain[s+'Hand']=dirTo(s+'Hand',s+'HandMiddle1');
    FINGERS.forEach(f=>{for(let k=1;k<=3;k++){const d=dirTo(s+'Hand'+f+k,s+'Hand'+f+(k+1));if(d)chain[s+'Hand'+f+k]=d}});
    chain[s+'UpLeg']=dirTo(s+'UpLeg',s+'Leg');chain[s+'Leg']=dirTo(s+'Leg',s+'Foot');chain[s+'Foot']=dirTo(s+'Foot',s+'ToeBase');
  });
  const len=(a,b)=>rest[a].p.distanceTo(rest[b].p);
  const L={arm:len('RightArm','RightForeArm'),fore:len('RightForeArm','RightHand'),thigh:len('RightUpLeg','RightLeg'),shin:len('RightLeg','RightFoot')};
  /* zonas de músculo (en pose T, marco del cuerpo) */
  const REG={pec:[],deltAnt:[],deltLat:[],deltPost:[],espalda:[],triceps:[],dorsal:[],cuadriceps:[],gluteo:[],isquios:[],aductores:[],gluteoMed:[],gemelos:[],soleo:[],biceps:[],braquiorradial:[],abdomen:[],oblicuos:[]};
  const KEYS=Object.keys(REG).filter(k=>!only||only.includes(k));   // solo se calcula lo que se va a pintar (la parte más lenta de la carga)
  SIDES.forEach(([s,sd])=>{const J=rest[s+'Arm'].p;
    REG.pec.push({c:V(J.x*0.5,J.y-0.09,J.z+0.08),r:V(Math.abs(J.x)*0.78,.125,.12),front:J.z-0.01});        // pectoral mayor
    REG.deltAnt.push({c:V(J.x+sd*.045,J.y+.005,J.z+.035),r:V(.1,.095,.08),front:J.z-.005});              // deltoides anterior
    REG.deltLat.push({c:V(J.x+sd*.085,J.y+.01,J.z),r:V(.085,.1,.095)});                                   // deltoides lateral
    REG.deltPost.push({c:V(J.x+sd*.045,J.y+.005,J.z-.035),r:V(.1,.095,.08),back:J.z+.005});              // deltoides posterior
    REG.biceps.push({c:V(J.x+sd*.15,J.y-.005,J.z+.035),r:V(.12,.05,.05),front:J.z+.005});                 // bíceps (frente del brazo en pose T)
    REG.braquiorradial.push({c:V(J.x+sd*(L.arm+.07),J.y+.01,J.z+.025),r:V(.085,.045,.045),front:J.z});         // braquiorradial (antebrazo, lado del pulgar)
    REG.triceps.push({c:V(J.x+sd*.17,J.y-.01,J.z-.035),r:V(.13,.055,.055),back:J.z+.01});              // tríceps (parte de atrás del brazo en pose T)
    REG.dorsal.push({c:V(J.x*.78,J.y-.2,J.z-.035),r:V(.085,.19,.1),back:J.z+.03});                  // dorsal ancho (costado y espalda bajo la axila)
    {const Hj=rest[s+'UpLeg'].p,Kj=rest[s+'Leg'].p,ty=(Hj.y+Kj.y)/2,ry=(Hj.y-Kj.y)/2;
      REG.cuadriceps.push({c:V(Hj.x+sd*.01,ty+.03,Hj.z+.03),r:V(.085,ry+.04,.08),front:Hj.z-.005});              // cuádriceps (frente del muslo)
      REG.isquios.push({c:V(Hj.x,ty,Hj.z-.03),r:V(.08,ry,.075),back:Hj.z-.005});                              // isquiotibiales
      REG.gluteo.push({c:V(Hj.x*.9,Hj.y+.01,Hj.z-.06),r:V(.105,.12,.09),back:Hj.z-.025});                     // glúteo mayor
      REG.aductores.push({c:V(Hj.x*.55,Hj.y-.14,Hj.z),r:V(.045,.15,.075)});
      REG.gluteoMed.push({c:V(Hj.x*1.45,Hj.y+.08,Hj.z-.02),r:V(.065,.08,.085)});                              // glúteo medio (costado de la cadera)
      const Aj=rest[s+'Foot'].p,ly=Kj.y-Aj.y;
      REG.gemelos.push({c:V(Kj.x,Kj.y-ly*.3,Kj.z-.035),r:V(.065,ly*.3,.06),back:Kj.z-.0});                    // gastrocnemio
      REG.soleo.push({c:V(Kj.x,Kj.y-ly*.62,Kj.z-.02),r:V(.055,ly*.2,.055),back:Kj.z+.01})}                   // sóleo                                  // aductores (cara interna)
    {const Hp0=rest.Hips.p,Sy0=J.y,ty=Hp0.y+(Sy0-Hp0.y)*.4;
     if(sd<0)REG.abdomen.push({c:V(0,ty,Hp0.z+.08),r:V(.085,(Sy0-Hp0.y)*.32,.08),front:Hp0.z+.03});                 // recto abdominal
     REG.oblicuos.push({c:V(sd*.12,Hp0.y+(Sy0-Hp0.y)*.33,Hp0.z+.02),r:V(.06,(Sy0-Hp0.y)*.27,.1)})}                 // oblicuos
    REG.espalda.push({c:V(J.x*.45,J.y-.1,J.z-.08),r:V(Math.abs(J.x)*.65,.16,.09),back:J.z-.02});          // trapecio medio y romboides
  });
  const colorSets=[];
  const Sy=rest.RightArm.p.y,Hp=rest.Hips.p,met={chestZ:-9,backZ:9,seatY:9,torsoW:0,thighZ:-9,bellyZ:-9,headTop:0};
  meshes.forEach(m=>{const joints=/joint/i.test(m.name);
    m.material=new THREE.MeshStandardMaterial({color:joints?0x8f9094:0xffffff,roughness:joints?.4:.55,metalness:joints?.25:0,skinning:!!m.isSkinnedMesh,vertexColors:!joints});
    if(joints||!m.isSkinnedMesh)return;
    m.skeleton.update();
    const pos=m.geometry.attributes.position,n=pos.count,col=new Float32Array(n*3),v=new THREE.Vector3(),ws={};Object.keys(REG).forEach(k=>ws[k]=[]);
    const si=m.geometry.attributes.skinIndex,sw=m.geometry.attributes.skinWeight,hipIdx=new Set();m.skeleton.bones.forEach((b,k)=>{if(nameOf(b)==='Hips')hipIdx.add(k)});
    const domHips=i=>{if(!si||!sw)return false;let bi=-1,bw=-1;for(let c=0;c<4;c++){const w=sw.array[i*sw.itemSize+c];if(w>bw){bw=w;bi=si.array[i*si.itemSize+c]}}return hipIdx.has(bi)};
    for(let i=0;i<n;i++){v.fromBufferAttribute(pos,i);m.boneTransform(i,v);v.applyMatrix4(m.matrixWorld);
      for(const k of KEYS){let w=0;for(const R of REG[k]){if(R.front!=null&&v.z<R.front)continue;if(R.back!=null&&v.z>R.back)continue;
        const dx=(v.x-R.c.x)/R.r.x,dy=(v.y-R.c.y)/R.r.y,dz=(v.z-R.c.z)/R.r.z,e=Math.sqrt(dx*dx+dy*dy+dz*dz);if(e<1)w=Math.max(w,Math.min(1,1.25*(1-Math.pow(e,6))))}
        if(w>0)ws[k].push(i,w)}
      col[i*3]=BASE[0];col[i*3+1]=BASE[1];col[i*3+2]=BASE[2];
      const ax=Math.abs(v.x);
      if(ax<.12&&v.y>Sy-.16&&v.y<Sy-.02)met.chestZ=Math.max(met.chestZ,v.z);
      if(ax<.15&&v.y>Hp.y&&v.y<Sy)met.backZ=Math.min(met.backZ,v.z);
      if(domHips(i))met.seatY=Math.min(met.seatY,v.y);
      if(v.y>Hp.y&&v.y<Sy-.15&&ax<.3)met.torsoW=Math.max(met.torsoW,ax);
      if(v.y>Hp.y-.3&&v.y<Hp.y&&ax<.2)met.thighZ=Math.max(met.thighZ,v.z);
      if(v.y>Hp.y+.08&&v.y<Sy-.3&&ax<.12)met.bellyZ=Math.max(met.bellyZ,v.z);
      if(ax<.15)met.headTop=Math.max(met.headTop,v.y)}
    const attr=new THREE.BufferAttribute(col,3);m.geometry.setAttribute('color',attr);colorSets.push({attr,ws,active:[]});
  });
  G.remove(root);
  if(met.seatY>Hp.y)met.seatY=Hp.y-.1;if(met.chestZ<-1)met.chestZ=rest.RightArm.p.z+.12;if(met.backZ>1)met.backZ=Hp.z-.11;if(!met.torsoW)met.torsoW=.16;if(met.thighZ<-1)met.thighZ=Hp.z+.09;if(met.bellyZ<-1)met.bellyZ=Hp.z+.1;
  return{root,bones,rest,chain,L,colorSets,met};
}
const BASE=[.82,.82,.81],RED=[.75,.015,.008];
const MUSC_NAME={pec:'Pectoral mayor',deltAnt:'Deltoides anterior',deltLat:'Deltoides lateral',deltPost:'Deltoides posterior',espalda:'Trapecio medio y romboides',triceps:'Tríceps',dorsal:'Dorsal ancho',cuadriceps:'Cuádriceps',gluteo:'Glúteo mayor',isquios:'Isquiotibiales',aductores:'Aductores',gluteoMed:'Glúteo medio',gemelos:'Gemelos (gastrocnemio)',soleo:'Sóleo',biceps:'Bíceps',braquiorradial:'Braquiorradial y braquial',abdomen:'Recto abdominal',oblicuos:'Oblicuos'};
function setMuscles(mu){C.colorSets.forEach(cs=>{const a=cs.attr.array,mx=new Map();
  for(let i=0;i<a.length;i+=3){a[i]=BASE[0];a[i+1]=BASE[1];a[i+2]=BASE[2]}
  Object.entries(mu).forEach(([k,f])=>{const w=cs.ws[k]||[];for(let j=0;j<w.length;j+=2){const v=w[j+1]*f;if(v>(mx.get(w[j])||0))mx.set(w[j],v)}});
  cs.active=[];mx.forEach((v,i)=>cs.active.push(i,v));cs.attr.needsUpdate=true})}
function paint(k){C.colorSets.forEach(({attr,active:ws})=>{const a=attr.array;for(let j=0;j<ws.length;j+=2){const i=ws[j],w=ws[j+1]*k;
  a[i*3]=BASE[0]+(RED[0]-BASE[0])*w;a[i*3+1]=BASE[1]+(RED[1]-BASE[1])*w;a[i*3+2]=BASE[2]+(RED[2]-BASE[2])*w}attr.needsUpdate=true})}


/* ===================== LÍMITES DEL CUERPO Y REGLAS ARTICULARES =====================
   Volúmenes del cuerpo (en el marco del cuerpo): cabeza, cuello, torso y muslos. Ninguna mano, agarre ni codo puede quedar dentro;
   si un objetivo cae adentro, se empuja a la superficie más cercana. Además se limitan los ángulos de codo, rodilla y hombro. */
const LIM={elbowMaxFlex:145,kneeMaxFlex:150,shoulderMaxExt:60,crossBody:35};
function bodyVolumes(){const R=C.rest,m=C.met,Sy=R.RightArm.p.y,H=R.Hips.p,hd=R.Head?R.Head.p:V(0,Sy+.2,0);
  const rH=Math.max(.085,(m.headTop-hd.y)*.55),vols=[
    {t:'e',c:V(0,(H.y+Sy)/2-.02,(m.chestZ+m.backZ)/2),r:V(m.torsoW+.01,(Sy-H.y)/2+.07,(m.chestZ-m.backZ)/2+.01)},   // torso
    {t:'s',c:V(0,m.headTop-rH,hd.z+.02),r:rH},                                                                           // cabeza
    {t:'s',c:R.Neck?R.Neck.p.clone():V(0,Sy+.06,0),r:.065}];                                                             // cuello
  SIDES.forEach(([s])=>{if(!C.bones[s+'UpLeg'])return;const a=toLocalP(C.bones[s+'UpLeg'].getWorldPosition(V())),b=toLocalP(C.bones[s+'Leg'].getWorldPosition(V()));vols.push({t:'c',a,b,r:.075})});   // muslos (posición actual)
  return vols}
function pushOut(P,v,mg){
  if(v.t==='s'){const d=P.clone().sub(v.c),L=d.length(),R=v.r+mg;if(L<R){if(L<1e-6)d.set(0,0,1);return v.c.clone().addScaledVector(d.normalize(),R)}return P}
  if(v.t==='c'){const ab=v.b.clone().sub(v.a),t=Math.max(0,Math.min(1,P.clone().sub(v.a).dot(ab)/ab.lengthSq())),q=v.a.clone().addScaledVector(ab,t),d=P.clone().sub(q),L=d.length(),R=v.r+mg;
    if(L<R){if(L<1e-6)d.set(0,0,1);return q.addScaledVector(d.normalize(),R)}return P}
  const rr=v.r.clone().addScalar(mg),u=P.clone().sub(v.c).divide(rr),L=u.length();if(L<1){if(L<1e-6)u.set(0,0,1);return v.c.clone().add(u.normalize().multiply(rr))}return P}
function guardPoint(P,mg){const vols=bodyVolumes();let Q=P.clone();for(let k=0;k<3;k++)vols.forEach(v=>{Q=pushOut(Q,v,mg)});return Q}
// polo del codo seguro: el codo no entra al cuerpo ni se va hacia atrás o cruzado más de lo anatómico
function safePole(S,T,L1,L2,pole,sd){let r=ik(S,T,L1,L2,pole),E=r.E;
  let Eg=guardPoint(E,.05);
  const u=Eg.clone().sub(S).normalize(),ext=Math.asin(Math.max(-1,Math.min(1,-u.z)))/D2R;          // extensión del hombro (codo detrás del cuerpo)
  if(ext>LIM.shoulderMaxExt){u.z=-Math.sin(LIM.shoulderMaxExt*D2R);Eg=S.clone().addScaledVector(u.normalize(),L1)}
  const cross=Math.asin(Math.max(-1,Math.min(1,-u.x*sd)))/D2R;                                      // codo cruzando hacia el otro lado
  if(cross>LIM.crossBody){u.x=-sd*Math.sin(LIM.crossBody*D2R);Eg=S.clone().addScaledVector(u.normalize(),L1)}
  return Eg.sub(S)}

/* ---------- pose: cada hueso apunta a una dirección (marco del cuerpo) con giro controlado ---------- */
const Ginv=new THREE.Quaternion(),tq=new THREE.Quaternion(),tq2=new THREE.Quaternion();
function curWorldQ(bone,out){bone.updateWorldMatrix(true,false);bone.getWorldQuaternion(out);return out.premultiply(Ginv)}
function aim(name,dir,ref0,refWant){
  const b=C.bones[name];if(!b||!C.chain[name])return;
  const d0=C.chain[name],d1=dir.clone().normalize(),RW=C.rest[name].q;
  const qs=new THREE.Quaternion().setFromUnitVectors(d0,d1);
  let q=qs.clone();
  if(ref0&&refWant){const r=ref0.clone().applyQuaternion(qs);r.addScaledVector(d1,-r.dot(d1));const w=refWant.clone().addScaledVector(d1,-refWant.dot(d1));
    if(r.lengthSq()>1e-6&&w.lengthSq()>1e-6){r.normalize();w.normalize();const ang=Math.atan2(d1.dot(r.clone().cross(w)),r.dot(w));q.premultiply(tq2.setFromAxisAngle(d1,ang))}}
  q.multiply(RW);

}
function ik(S,T,L1,L2,pole,maxFlex){const d=T.clone().sub(S);let dist=d.length();const dir=d.clone().normalize();dist=Math.min(dist,L1+L2-1e-4);
  const g=(180-(maxFlex||LIM.elbowMaxFlex))*D2R;dist=Math.max(dist,Math.sqrt(L1*L1+L2*L2-2*L1*L2*Math.cos(g)));   // flexión máxima
  const a=(L1*L1+dist*dist-L2*L2)/(2*dist),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  const p=pole.clone().addScaledVector(dir,-pole.dot(dir)).normalize();
  return{E:S.clone().addScaledVector(dir,a).addScaledVector(p,h),T:S.clone().addScaledVector(dir,dist)}}
const toLocalP=p=>p.clone().sub(G.position).applyQuaternion(Ginv),toLocalD=d=>d.clone().applyQuaternion(Ginv);
const FRONT=V(0,0,1),UPB=V(0,1,0),PALM0=V(0,-1,0);

function poseArm(s,sd,T,pole,axis,ext,curl,palmWant){
  const R=C.rest,S=R[s+'Arm'].p,res=ik(S,T,C.L.arm,C.L.fore,pole),E=res.E,W=res.T;
  const up=E.clone().sub(S).normalize(),fo=W.clone().sub(E).normalize();
  const palm=palmWant?palmWant.clone().addScaledVector(fo,-palmWant.dot(fo)).normalize():axis.clone().normalize().cross(fo).normalize();      // palma pedida o eje del agarre × antebrazo
  aim(s+'Arm',up,FRONT,fo.clone().addScaledVector(up,-fo.dot(up)));
  aim(s+'ForeArm',fo,PALM0,palm);
  const extQ=new THREE.Quaternion().setFromAxisAngle(fo.clone().cross(palm).normalize(),-ext*D2R); // dorso de la mano hacia atrás
  const hd=fo.clone().applyQuaternion(extQ),hp=palm.clone().applyQuaternion(extQ);
  aim(s+'Hand',hd,PALM0,hp);
  const ax=hd.clone().cross(hp).normalize();
  FINGERS.forEach(f=>{let acc=0;curl.forEach((c,k)=>{acc+=c;const q=new THREE.Quaternion().setFromAxisAngle(ax,acc*D2R);
    aim(s+'Hand'+f+(k+1),hd.clone().applyQuaternion(q),PALM0,hp.clone().applyQuaternion(q))})});
  return{W,hd,hp,across:ax}
}
function poseLeg(s,ankleW,poleW,fwdW,floor,upW){
  const R=C.rest,H=R[s+'UpLeg'].p;ankleW=ankleW.clone();if(floor!=='abs')ankleW.y=R[s+'Foot'].p.y+.003+(floor||0);const T=toLocalP(ankleW),pole=toLocalD(poleW),fwd=toLocalD(fwdW).normalize(),upL=toLocalD(upW||UPV);
  const res=ik(H,T,C.L.thigh,C.L.shin,pole,LIM.kneeMaxFlex),K=res.E,A=res.T;
  const th=K.clone().sub(H).normalize(),sh=A.clone().sub(K).normalize();
  const kneeFront=sh.clone().addScaledVector(th,-sh.dot(th)).negate();
  aim(s+'UpLeg',th,FRONT,kneeFront);
  aim(s+'Leg',sh,FRONT,fwd.clone().addScaledVector(sh,-fwd.dot(sh)));
  const d0=C.chain[s+'Foot'],dn=-d0.y,fw=Math.sqrt(Math.max(0,1-dn*dn));      // pie plano: misma inclinación que de pie
  aim(s+'Foot',fwd.clone().multiplyScalar(fw).addScaledVector(upL,-dn),UPB,upL);
}

     alcanza al frente, se adelanta. Cada lado por separado, así que sirve igual en ejercicios alternos o a un brazo.

       entre lumbar, dorsal media y dorsal alta con los pesos w; head = cabeza respecto al pecho (+ mira arriba);
       keepChest: el pecho se queda como estaba y la que bascula es la pelvis (true: hombros donde los puso el ejercicio · 'rest': donde
       quedaban con el torso recto)
   El marco del cuerpo (G) sigue siendo la pelvis. Las manos se calculan igual que antes y el brazo se resuelve desde donde quedó el
   hombro de verdad: llegan a los mismos agarres y el mecanismo de las máquinas no cambia. Con torsoHands:true el recorrido de la mano

    if(sp){ax+=(sp.x||0)*w[i];ay+=(sp.y||0)*w[i];az+=(sp.z||0)*w[i]}
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(ax*D2R,ay*D2R,az*D2R,'YXZ'));if(i===2)TORSO.Rtop.copy(q);

/* ===================== PRESS CON MANCUERNAS: recorrido corregido =====================
   Antes la mano iba en línea recta de abajo a arriba y el codo "salía a donde cupiera": a media repetición los codos se abrían de más,
   el antebrazo se inclinaba hacia adentro y la mancuerna se ladeaba. Ahora manda el brazo: el brazo (hombro→codo) gira en su plano y el
   antebrazo va vertical, con la muñeca encima del codo en todo el recorrido; arriba las mancuernas quedan sobre los hombros, cerca pero sin chocar. */
const DBP={};
function dbPressHand(c){const at=(s,sd,p)=>{const S=C.rest[s+'Arm'].p,th=(c.t0+(c.t1-c.t0)*p)*D2R;
    const u=c.out(sd).multiplyScalar(Math.cos(th)).addScaledVector(c.up,Math.sin(th)).normalize();          // dirección del brazo
    const f=c.up.clone().addScaledVector(V(-sd,0,0),Math.tan(c.lean*D2R*p*p)).normalize();                  // antebrazo: vertical (lean = grados que se cierra arriba)
    return{u,H:S.clone().addScaledVector(u,C.L.arm).addScaledVector(f,C.L.fore*.985)}};
  return (s,sd,p)=>{const r=at(s,sd,p),gap=Math.max(0,.21-Math.abs(at(s,sd,1).H.x));                        // hombros angostos: arriba se abre lo justo para que las mancuernas no choquen
    DBP[sd]=r.u;r.H.x+=sd*gap*p*p;return r.H}}

  Object.assign(e,{torsoHands:true,hand:dbPressHand({t0:-28,t1:80,lean:0,up:V(0,0,1),out:sd=>V(sd*Math.sin(a),-Math.cos(a),0)}),

    scap:(sd,p)=>V(0,0,-.02*(1-p)+.012*p)})}             // abajo las escápulas se juntan contra el banco; arriba el hombro acompaña
{const b=28*D2R,e=EX['press-hombro-mancuernas-banco']; // sentado: codos ~28° por delante del plano del cuerpo; abajo, mancuernas a la altura de las orejas

function placeBody(){
  G.quaternion.setFromAxisAngle(V(1,0,0),(ex.body.rx||0)*D2R);
  const H=C.rest.Hips.p,mt=C.met;let hipsW;
  if(ex.body.anchor){const a=ex.body.anchor();G.position.copy(a.world).sub(a.local.clone().applyQuaternion(G.quaternion));G.updateMatrixWorld(true);Ginv.copy(G.quaternion).invert();return}
  if(ex.body.stand)hipsW=H.clone().add(ex.body.hipsOff||V(0,0,0));                                    // de pie: pies en el piso como en reposo
  else if(ex.body.bench)hipsW=V(0,BENCH_TOP+.004+(H.z-mt.backZ),0);           // espalda apoyada en el cojín
  else hipsW=V(0,ex.body.seat+.004+(H.y-mt.seatY)*Math.cos((ex.body.rx||0)*D2R),0); // glúteo apoyado en el asiento
  const h=H.clone().applyQuaternion(G.quaternion);
  G.position.copy(hipsW).sub(h);G.updateMatrixWorld(true);Ginv.copy(G.quaternion).invert();
}
function placeEquipStatic(){
  Object.values(EQ).forEach(g=>g.visible=false);(ex.show||[]).forEach(k=>{if(EQ[k])EQ[k].visible=true});if(ex.equip==='fly')placeFly();if(ex.equip==='dip')placeDip();if(ex.place)ex.place();upgradeTowers();
  if(ex.equip==='machine'){
    const loc=(x,y,z)=>G.localToWorld(V(x,y,z));const R=C.rest,hp=R.Hips.p,S=R.RightArm.p,hw=G.localToWorld(hp.clone()),st=ex.body.seat;
    seat.position.set(0,st-.045,hw.z+.02);
    seatPost.position.set(0,(st-.09)/2+.03,seat.position.z);seatPost.scale.y=st-.09;
    seatKnob.position.set(.2,st-.17,seat.position.z+.08);seatKnob.rotation.z=1.25;
    back.quaternion.copy(G.quaternion);back.position.copy(loc(0,(hp.y+S.y)/2+.1,C.met.backZ-.046));
    const bTop=back.position.clone().add(V(0,-.25,-.08));between(backPost,V(0,.06,bTop.z-.08),bTop);
    // arco de las empuñaduras: pivote bajo, delante del asiento
    const tg=armTargets('Right',-1),gL=w=>G.localToWorld(w.clone().add(V(0,-.03,.085)));
    const gb=gL(tg.Tb),gt=gL(tg.Tt),Pz=(gb.z+gt.z)/2,Py=.3,Rr=(gb.y+gt.y)/2-Py,xL=Math.abs(gb.x)+.09;
    MACH={zb:gb.z,zt:gt.z,Pz,Py,R:Rr,xL};
    levers.forEach((g,i)=>{const sd=i?1:-1,u=g.userData,O=V(0,Rr,0),K=V(0,Rr*.52,-.12),inw=-sd;
      g.position.set(sd*xL,Py,Pz);between(u.a,V(0,0,0),K);between(u.b,K,O);
      u.h.position.set(inw*.085,Rr,0);u.h.rotation.set(0,0,Math.PI/2);u.cap.position.set(inw*.175,Rr,0);u.cap.rotation.set(0,0,Math.PI/2)});
    pivotPosts.forEach((p,i)=>{const sd=i?1:-1;p.position.set(sd*xL,Py/2,Pz);p.scale.y=Py});
    const z0=back.position.z-.2,z1=Pz+.08;baseLong.position.set(0,.03,(z0+z1)/2);baseLong.scale.z=z1-z0;
    baseCross.position.set(0,.03,Pz);baseCross.scale.x=2*xL+.12;
    const tz=hw.z-.25,tx=.8;tower.position.set(tx,0,tz);baseTower.position.set(tx/2,.03,tz);baseTower.scale.x=tx;
  }
}
function armTargets(s,sd){const A=ex.arm,S=C.rest[s+'Arm'].p,reach=0.96*(C.L.arm+C.L.fore);
  const xB=sd*A.gripB,xT=sd*A.gripT,dxT=Math.abs(xT-S.x),dyT=A.dyT;
  const zT=S.z+Math.sqrt(Math.max(.01,reach*reach-dxT*dxT-dyT*dyT));
  return{Tb:V(xB,S.y+A.dyB,C.met.chestZ+A.chest-.085),Tt:V(xT,S.y+A.dyT,zT)}}

/* ---------- ciclo: arriba → baja 2 s → pausa → empuja 1.2 s → arriba ---------- */
const T_HOLD=500,T_DOWN=2000,T_PAUSE=300,T_UP=1200,T=T_HOLD+T_DOWN+T_PAUSE+T_UP;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function progress(t){if(t<T_HOLD)return 1;t-=T_HOLD;if(t<T_DOWN)return 1-ease(t/T_DOWN);t-=T_DOWN;if(t<T_PAUSE)return 0;t-=T_PAUSE;return ease(t/T_UP)}

function pose(p){
  if(ex.soloEquipo){if(ex.anim)ex.anim(p);return}
  const A=ex.arm,R=C.rest,grips={};
  torsoPre(p);
  if(ex.bodyAt){const b=torsoBody(ex.bodyAt(p));if(b.q)setBodyQ(b.q,b.hips);else setBodyFrame(b.rx,b.hips)}
  if(ex.leg)SIDES.forEach(([s,sd])=>{const lg=ex.leg(sd,p);poseLeg(s,lg.ankle,lg.pole,lg.fwd,lg.floor,lg.up)});
  SIDES.forEach(([s,sd])=>{
    torsoHand(1);let T;if(ex.hand)T=ex.hand(s,sd,p);else{const tg=armTargets(s,sd);T=tg.Tb.clone().lerp(tg.Tt,p)}
    if(ex.equip==='machine'&&MACH){const z=MACH.zb+(MACH.zt-MACH.zb)*p,y=MACH.Py+Math.sqrt(Math.max(0,MACH.R*MACH.R-(z-MACH.Pz)*(z-MACH.Pz)));
      T=toLocalP(V(sd*(MACH.xL-.09),y,z)).add(V(0,.03,-.085))}            // la mano sigue el arco del brazo de la máquina
    T=guardPoint(T,ex.clear||.075);torsoHand(0);torsoScapAuto(s,sd,T,A.pole(sd));const Sh=C.rest[s+'Arm'].p,pl=safePole(Sh,T,C.L.arm,C.L.fore,A.pole(sd),sd);
    const r=poseArm(s,sd,T,pl,A.axis(sd),A.ext,A.curl,A.palm?A.palm(sd):null);
    grips[s]={c:r.W.clone().addScaledVector(r.hd,.085).addScaledVector(r.hp,.03),ax:r.across};
  });
  if(ex.headPitch){const hp=ex.headPitch*D2R;[['Neck',.4],['Head',1]].forEach(([n,f])=>{const b=C.bones[n];if(!b)return;
    const q=new THREE.Quaternion().setFromAxisAngle(V(1,0,0),-hp*f).multiply(C.rest[n].q).premultiply(TORSO.Rtop);curWorldQ(b.parent,tq);b.quaternion.copy(tq.invert().multiply(q))})}
  C.root.updateMatrixWorld(true);
  const gw=s=>G.localToWorld(grips[s].c.clone()),gax=s=>grips[s].ax.clone().applyQuaternion(G.quaternion);
  if(ex.equip==='barbell'){const a=gw('Right'),b=gw('Left');EQ.barbell.position.copy(a.add(b).multiplyScalar(.5))}
  if(ex.equip==='dumbbell'){EQ.dbR.position.copy(gw('Right'));alignY(EQ.dbR,gax('Right'));EQ.dbL.position.copy(gw('Left'));alignY(EQ.dbL,gax('Left'))}
  if(ex.equip==='machine'&&MACH){['Right','Left'].forEach((s,i)=>{const g=gw(s);levers[i].rotation.x=Math.atan2(g.z-MACH.Pz,g.y-MACH.Py)})}
  if(ex.after)ex.after(p,gw,grips);
  liftTowers(p);
  paint(.88+.12*(1-p));
  torsoPost();
}

/* ---------- cámara ---------- */
let yaw=0,pitch=.2,dist=4,yawGoal=0,target=V(0,1,0),vi=0;
function setCam(){yaw=yawGoal=ex.cam.yaw;pitch=ex.cam.pitch;dist=ex.cam.dist;target=ex.cam.t.clone();vi=0}
function placeCam(){yaw+=(yawGoal-yaw)*.12;cam.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));cam.lookAt(target)}
let drag=false,px=0,py=0;
stage.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;stage.style.cursor='grabbing'});
window.addEventListener('pointerup',()=>{drag=false;stage.style.cursor='grab'});
window.addEventListener('pointermove',e=>{if(!drag)return;yawGoal-=(e.clientX-px)*.01;pitch=Math.max(-.05,Math.min(1.2,pitch+(e.clientY-py)*.005));px=e.clientX;py=e.clientY});
document.getElementById('view').onclick=()=>{vi=(vi+1)%4;yawGoal=ex.cam.yaw+[0,.75,1.6,-.9][vi];pitch=[ex.cam.pitch,.25,.3,.9][vi]};

/* ---------- visor ---------- */
const Q=new URLSearchParams(location.search),COMPACT=Q.get('compact')==='1';
if(COMPACT){document.documentElement.classList.add('compact');resize()}
exId=Q.get('ej');if(!EX[exId]){fail('Esta animación no existe.');return}
ex=EX[exId];document.getElementById('title').textContent=ex.nombre;document.title=ex.nombre+' · Reps';
const MOD=Q.get('modelo')==='mujer'?'mujer':'hombre',HGT={hombre:1.78,mujer:1.66};
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=0,last=null,run=!reduce,speed=1;
const playBtn=document.getElementById('play');
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>';
function setPlay(){playBtn.innerHTML=run?ICON_PAUSE:ICON_PLAY;playBtn.setAttribute('aria-label',run?'Pausar':'Reproducir')}setPlay();
playBtn.addEventListener('pointerdown',e=>e.stopPropagation());playBtn.onclick=()=>{run=!run;setPlay()};
document.getElementById('speed').onchange=e=>{speed=parseFloat(e.target.value)||1};
let visible=true,shown=false;new IntersectionObserver(es=>{visible=es[0].isIntersecting}).observe(stage);   // no dibuja si no se ve (ahorra batería)
function loop(ts){requestAnimationFrame(loop);if(last===null)last=ts;const dt=ts-last;last=ts;if(document.hidden||!visible)return;
  if(run)t=(t+dt*speed)%T;if(C){try{pose(progress(t))}catch(e){console.error(e)}}placeCam();renderer.render(scene,cam);if(C&&!shown){shown=true;requestAnimationFrame(()=>document.documentElement.classList.add('ready'))}}
(window.__fbx||Promise.reject()).catch(()=>fetch('modelos/'+MOD+'.fbx').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})).then(buf=>{
  const m=buildModel(new THREE.FBXLoader().parse(buf,''),HGT[MOD],Object.keys(ex.musc||{pec:1}));C=m;G.add(m.root);
  placeBody();placeEquipStatic();setMuscles(ex.musc||{pec:1});setCam();statusEl.hidden=true;
}).catch(e=>{console.error(e);fail('No se pudo cargar el personaje. Revisa tu conexión.')});
requestAnimationFrame(loop);
})();
</script>
