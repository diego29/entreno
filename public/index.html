<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tempo · Reps</title>
<meta name="theme-color" content="#15181E">
<link rel="icon" href="icons/tempo-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#EEF0F3;--surface:#fff;--ink:#15181E;--muted:#5E6573;--line:#D9DDE3;--accent:#D63A2B}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--surface:#1A1D24;--ink:#ECEEF2;--muted:#9AA1AE;--line:#2E333C;--accent:#F0533F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:44px;text-transform:uppercase;margin:0 0 6px;line-height:1}
p{color:var(--muted);margin:0 0 10px}
a{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;color:inherit;text-decoration:none}
a img{width:56px;height:56px;border-radius:12px}
a b{font-size:17px;display:block}
a span{color:var(--muted);font-size:14px}
</style></head><body>
<main>
  <h1>Tempo · Reps</h1>
  <p>Elige tu app. Tus clientes entran con el link personal que les mandas.</p>
  <a href="entrenador/"><img src="icons/tempo-192.png" alt=""><div><b>Tempo</b><span>Panel del entrenador</span></div></a>
  <a href="cliente/"><img src="icons/cliente-192.png" alt=""><div><b>Reps</b><span>App del cliente</span></div></a>
</main>
</body></html>
