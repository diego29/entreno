<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}.inp.need,input.need,textarea.need{outline:2px solid var(--accent);outline-offset:1px}
.dgrow{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;word-break:break-word}.dgrow.ok b{color:var(--ok)}.dgrow.bad{border-color:var(--accent)}.dgrow.bad b{color:var(--accent)}.dgrow span{color:var(--muted);font-size:13px}
.nx.baja i{background:var(--warn);color:#fff}.nx.ajuste i{background:color-mix(in srgb,var(--warn) 25%,var(--surface));color:var(--warn)}
.why.baja{border-color:var(--warn);color:var(--ink)}.why.baja svg{color:var(--warn)}
.exhist{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 14px;background:var(--surface);display:grid;gap:6px}
.eh-row{display:grid;grid-template-columns:28px 52px 1fr auto 22px;gap:8px;align-items:center;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
.eh-row.eh-h{border-top:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0}
.eh-row em{display:block;font-style:normal;font-size:12px}.eh-row .bad{color:var(--accent)}.eh-row .up{color:var(--ok)}.eh-row .ok{color:var(--muted)}
.eh-row span:nth-child(4){font-size:12px;text-align:right}.eh-v{font-size:13px;font-weight:600}.eh-next{font-size:13.5px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.timer.sm{width:min(42vw,150px);margin:2px auto 0}.timer.sm .t{font-size:38px}
.nextcard{display:grid;gap:8px}.nextcard .nc-top{display:flex;gap:12px;align-items:center}.nextcard .nc-w{margin-left:auto;text-align:right;font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.nextcard .nc-w small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted)}.nextcard .nc-g{background:var(--surface2);border-radius:12px;padding:8px}.nextcard .nc-g svg{width:100%;height:auto;display:block}
.nextcard .nc-why{font-size:13px;color:var(--muted)}
</style>
<title>Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app móvil de una columna, barra inferior con 3 pestañas, hojas (sheets) que suben desde abajo */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface2:#F6F7F9; --ink:#15181E; --muted:#5E6573; --line:#D9DDE3;
  --accent:#D63A2B; --accent-ink:#FFFFFF; --on-feel:#FFFFFF; --accent-soft:#FBE4E1; --ok:#23834A; --warn:#B7791F;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mat:#FFFFFF; --bar:#7B818C; --sleeve:#A9AEB7; --frame:#C9CDD4;
  --p45:#2F5FB3; --p35:#E0B12E; --p25:#2E8B57; --p10:#3A3F48; --p5:#6E7581; --p2:#C4C8CE;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1A1D24; --surface2:#21252D; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2E333C;
  --accent:#F0533F; --accent-ink:#FFFFFF; --on-feel:#111318; --mat:#ECECEE; --bar:#8E95A1; --sleeve:#5F6672; --frame:#3C424C; --accent-soft:#3A1D1A; --ok:#4FC07C; --warn:#E3AA4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1A1D24; --surface2:#21252D; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2E333C;
  --accent:#F0533F; --accent-ink:#FFFFFF; --on-feel:#111318; --mat:#ECECEE; --bar:#8E95A1; --sleeve:#5F6672; --frame:#3C424C; --accent-soft:#3A1D1A; --ok:#4FC07C; --warn:#E3AA4C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;padding-block:14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1}
h1{font-size:34px;font-weight:800}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week{display:flex;gap:3px;margin-top:6px}
.week i{width:16px;height:5px;border-radius:2px;background:var(--line)}
.week i.on{background:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.ex{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px}
.btn.danger{color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:99px;padding:13px 18px}
/* Días */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-block:4px 14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day b{font-family:var(--display);font-size:18px;font-weight:700}
.day small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel small{color:var(--bg);opacity:.75}
.day .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.day.has .dot{background:var(--accent)}
/* Ejercicios */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;gap:10px}
.ex .num{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted);min-width:22px;flex:none;line-height:1.1}
.ex .title{font-weight:700}
.dose{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.dose span{color:var(--muted);font-size:16px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.link{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none}
.ex-actions{display:flex;flex-direction:column;gap:4px}
.ex-actions button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.ex-actions svg{width:15px;height:15px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
/* Form */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink)}
textarea.inp{min-height:70px;resize:vertical}
.daytitle{font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;background:transparent;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;padding:4px 0;width:100%;color:var(--ink)}
.daytitle::placeholder{color:var(--muted);opacity:.7}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs div{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
.grabzone{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:38px 1fr 38px;align-items:center;margin:0 -16px 8px;padding:8px 12px 6px;background:var(--surface);touch-action:none;cursor:grab}
.grab{width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.45;justify-self:center}
.sheet-x{width:34px;height:34px;border-radius:50%;background:var(--surface2)}
.sheet-x svg{width:16px;height:16px}
.picker{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.picker button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px}
.picker button:last-child{border-bottom:0}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group-h{margin-top:8px}
.mvprev{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mvprev>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.mvprev b{display:block;font-size:12px}.mvprev span{display:block;font-size:10.5px;line-height:1.15;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.mvprev .ch{border-color:var(--accent);background:var(--accent-soft)}.mvprev .ch span{color:var(--ink);font-weight:600}
.seg.wrap{flex-wrap:wrap}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.xpline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.xpbase{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-weight:600}
.xpd{background:var(--pc);color:var(--pt);border-radius:8px;padding:4px 8px;font-weight:800;font-family:var(--display);font-size:16px}
.xpline b{font-family:var(--display);font-size:20px;margin-left:auto}
.btn.xpon{border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.pops{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.pop{pointer-events:auto;width:100%;max-width:520px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer}
.pop .pi{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:800;font-size:17px}
.pop b{display:block;font-size:13px;opacity:.75;font-weight:600}.pop span{display:block;font-size:16px;font-weight:600;line-height:1.3;margin-top:1px;white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){.pop{animation:popin .35s cubic-bezier(.2,.8,.2,1.1)}@keyframes popin{from{transform:translateY(-120%);opacity:0}}}
.qchips{display:flex;flex-wrap:wrap;gap:6px}.qchips button{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.progup{display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,var(--ok) 13%,var(--surface));border:1.5px solid var(--ok);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.35}
.progup svg,.pc-ic svg{width:18px;height:18px;color:var(--ok);flex:none;margin-top:1px}
.progup b{font-family:var(--display);font-size:17px}
.progcard{background:var(--surface);border:1.5px solid var(--ok);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.progcard .pc-h{display:flex;align-items:center;gap:8px}
.pc-item{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.pc-t{font-weight:700;font-size:14px}.pc-s{font-size:13px;margin-top:2px}.pc-s b{font-family:var(--display);font-size:16px}.pc-d{font-size:12px;color:var(--muted);margin-top:2px}
.pc-a{display:flex;flex-direction:column;gap:4px;flex:none}.pc-a .btn{padding:6px 10px;font-size:13px}
details.adv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
details.adv summary{cursor:pointer;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:30}
.log{display:flex;flex-direction:column;gap:6px}
.sets{display:flex;flex-wrap:wrap;gap:5px}
.sets span{font-variant-numeric:tabular-nums;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
/* Modo entrenamiento */
.play-btn{width:100%;margin-top:10px;padding:15px;font-size:17px;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:700;border-radius:14px}
.play-btn svg{width:20px;height:20px}
.player{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:560px;margin:0 auto;padding:0 16px;min-height:100%;display:flex;flex-direction:column;gap:14px}
.pbar{display:flex;gap:3px}
.pbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pbar i.done{background:var(--accent)}
.pbar i.cur{background:var(--ink)}
.pbar i.gap{margin-left:5px}
.p-name{font-family:var(--display);font-weight:800;font-size:40px;text-transform:uppercase;line-height:.95;text-wrap:balance;overflow-wrap:anywhere}
.p-set{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;color:var(--accent);letter-spacing:.03em}
.goal{display:flex;gap:8px;flex-wrap:wrap}
.goal span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.goal span b{font-family:var(--display);font-size:18px}
.big-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stepper label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stepper input{width:100%;text-align:center;border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;padding:2px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.stepper .pm{display:flex;gap:8px;width:100%}
.stepper .pm button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:22px;font-weight:700;line-height:1}
.done-btn{padding:18px;font-size:20px;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:800;border-radius:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:3px 8px;font-weight:600}
.timer{position:relative;width:min(72vw,260px);aspect-ratio:1;max-width:100%;margin:8px auto 0}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:64px;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.sum b{display:block;font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.sum small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.switch{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:170px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:left}
.chip .nm{font-weight:700;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .st{font-size:11px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .st{color:var(--bg);opacity:.75}
.chip[data-state="rest"] .st{color:var(--warn)}
.chip[data-state="go"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chip[data-state="go"] .st{color:var(--accent);font-weight:700}
.chip[data-state="fin"] .st{color:var(--ok)}
.chip.add{flex-direction:row;align-items:center;gap:6px;border-style:dashed;color:var(--muted)}
.chip.add svg{width:16px;height:16px}
.mini-link{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;font-size:13px;font-weight:600;color:var(--accent)}
.mini-link svg{width:15px;height:15px}
.spark{width:84px;height:30px;flex:none}
.delta{display:inline-block;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.delta.up{color:var(--ok)}
.delta.down{color:var(--accent)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  button,.list-item,.day,.card,.chip,.seg button{transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease}

  .scrim{animation:nv-fade .2s ease-out}

  let carry=eff[from];eff[from]=null;let i=DAYS.findIndex(x=>x[0]===to);

  openSheet(`<h2 style="margin-bottom:4px">Mover ${esc(title(cur[from]))}</h2><p class="muted" style="margin:0 0 12px;font-size:13px">Del ${dayName(from).toLowerCase()} a otro día. Si ese día ya tiene rutina, se recorre al siguiente libre.</p>

    <button class="btn primary block" id="mv-go">Mover</button>`,()=>{
    $("#mv-days").onclick=e=>{const b=e.target.closest("[data-mvto]");if(!b)return;to=b.dataset.mvto;document.querySelectorAll("[data-mvto]").forEach(x=>x.classList.toggle("on",x===b));$("#mv-prev").innerHTML=preview()};
    $("#mv-go").onclick=async()=>{const eff=shiftPlan(c,from,to);if(!eff){toast("Elige otro día");return}

  });
}

  const draw=()=>{norm();const G=groups();$("#tpl-slots").innerHTML=t.slots.length?G.map((g,gi)=>{const body=g.map((i,k)=>rowHTML(t.slots[i],i)+(k<g.length-1?linkHTML(i,true):"")).join("");
      return (g.length>1?`<div class="superset"><div class="ss-h"><b>${groupLabel(g.length)}</b><span>sin descanso entre ejercicios · descanso al final de cada ronda</span></div>${body}</div>`:body)+(gi<G.length-1?linkHTML(g[g.length-1],false):"")}).join(""):`<div class="empty">Agrega el primer patrón de movimiento.</div>`};

function defaultPicks(t,c){
  const prefs=c?.patternPrefs||{};const used={},picks=[];
  (t.slots||[]).forEach(s=>{const opts=libByPattern(s.pattern);const n=used[s.pattern]=(used[s.pattern]||0);
    const pref=(prefs[s.pattern]||[])[n];let pick=opts.find(o=>o.id===pref);
    if(!pick)pick=opts.find(o=>!picks.includes(o.id))||opts[0];
    picks.push(pick?.id||null);used[s.pattern]=n+1});
  return picks;
}

  const step=niceStep((hi-lo)/4);const y0=Math.max(0,Math.floor(lo/step)*step),y1=Math.ceil(hi/step)*step;

  const Y=v=>m.t+(1-(v-y0)/(y1-y0||1))*(H-m.t-m.b);

  const xl=pts.length===1?[0]:pts.length===2?[0,1]:[0,Math.floor((pts.length-1)/2),pts.length-1];

    g+=`<text x="${xy[i][0]}" y="${H-8}" text-anchor="${anchor}" font-size="11" fill="var(--muted)">${fDate(pts[i].d)}</text>`});
  const line=xy.map(p=>p.join(",")).join(" ");
  const area=xy.length>1?`<path d="M${xy[0][0]},${Y(y0)} L${line.replace(/ /g," L")} L${xy[xy.length-1][0]},${Y(y0)} Z" fill="var(--accent)" fill-opacity=".1"/>`:"";

    ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===xy.length-1?5:4}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("")}

  const hit=$("#ch-hit"),tip=$("#ch-tip"),guide=$("#ch-guide"),dot=$("#ch-dot");

    let i=0,bd=Infinity;xy.forEach((p,j)=>{const d=Math.abs(p[0]-x);if(d<bd){bd=d;i=j}});

  const hide=()=>{tip.hidden=true;guide.setAttribute("visibility","hidden");dot.setAttribute("visibility","hidden")};
  hit.addEventListener("pointermove",show);hit.addEventListener("pointerdown",show);hit.addEventListener("pointerleave",hide);
}

let sheetGen=0;
function openSheet(html,onMount){
  sheetGen++;
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <div class="grabzone"><span></span><div class="grab" aria-hidden="true"></div><button class="icon-btn sheet-x" id="sheet-x" aria-label="Cerrar">${ICON.close}</button></div>${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")askCloseSheet()});
  $("#sheet-x").addEventListener("click",()=>askCloseSheet());

}
/* v55: si editaste algo y cierras (atrás, X, tocar fuera o deslizar), pregunta antes de perderlo */
let SHEET_SNAP=null;
function formSnap(){const sh=$(".sheet");if(!sh)return"";return [...sh.querySelectorAll("input,textarea,select")].filter(x=>!/-q$/.test(x.id)&&x.type!=="file"&&x.type!=="hidden").map(x=>x.type==="checkbox"||x.type==="radio"?x.checked:x.value).join("\u0001")}
function sheetDirty(){return !!$(".sheet")&&SHEET_SNAP!=null&&formSnap()!==SHEET_SNAP}
async function askCloseSheet(onKeep){if(!sheetDirty())return closeSheet();
  const ok=await confirmBox("¿Descartar los cambios?","Todavía no guardas lo que editaste.","Descartar","Seguir editando");
  if(ok){SHEET_SNAP=null;closeSheet()}else onKeep&&onKeep()}
function closeSheet(){
  const sh=$(".sheet"),sc=$("#scrim");if(!sh){$("#layer").innerHTML="";return}
  const gen=sheetGen;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){$("#layer").innerHTML="";return}
  sh.style.animation="none";sh.style.transition="transform .22s ease-in";sh.style.transform="translateY(105%)";
  sc.style.transition="opacity .22s";sc.style.opacity="0";sc.style.pointerEvents="none";
  setTimeout(()=>{if(gen===sheetGen)$("#layer").innerHTML=""},230);
}
/* Deslizar hacia abajo para cerrar: desde la barrita o cuando el menú está hasta arriba */
function swipeToClose(sh,sc){
  let y0=null,x0=0,dy=0,t0=0,drag=false;
  sh.addEventListener("touchstart",e=>{if(e.touches.length!==1){y0=null;return}
    const fromGrab=!!e.target.closest(".grabzone");if(sh.scrollTop>2&&!fromGrab){y0=null;return}
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0;t0=Date.now();drag=false},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;const d=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;
    if(!drag){if(Math.abs(dx)>Math.abs(d)&&Math.abs(dx)>8){y0=null;return}
      if(d>8){drag=true;sh.style.animation="none";sh.style.transition="none";if(document.activeElement?.blur)document.activeElement.blur()}
      else if(d<-8){y0=null;return}else return}
    dy=Math.max(0,d-8);sh.style.transform=`translateY(${dy}px)`;sc.style.opacity=String(Math.max(.25,1-dy/500));e.preventDefault()},{passive:false});
  const end=()=>{if(y0==null)return;y0=null;if(!drag)return;drag=false;
    const v=dy/Math.max(1,Date.now()-t0);
    const back=()=>{sh.style.transition="transform .2s ease-out";sh.style.transform="";sc.style.transition="opacity .2s";sc.style.opacity=""};
    if(dy>110||(v>.5&&dy>30)){if(sheetDirty()){back();askCloseSheet()}else closeSheet()}
    else back()};
  sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",end);
}

/* ---- Reordenar: solo el bloque que agarras se encoge a una tarjeta chica que sigue tu dedo (sin salir de la zona de ejercicios);
   los demás se quedan de su tamaño y se deslizan para abrirle espacio. Transición: el contenido se desvanece, el bloque cambia
   de alto suavemente y el contenido nuevo aparece; al soltar pasa lo mismo al revés. ---- */
const RO_FADE=110,RO_MS=260,RO_EASE="cubic-bezier(.22,.9,.25,1)";
function roResize(el,toMini,onFrame,done){
  el.classList.add("ro-anim","ro-fade");
  setTimeout(()=>{const h0=el.getBoundingClientRect().height;el.classList.toggle("mini",toMini);const h1=el.getBoundingClientRect().height;
    el.style.height=h0+"px";el.style.overflow="hidden";void el.offsetHeight;
    el.style.transition=`height ${RO_MS}ms ${RO_EASE}`;el.style.height=h1+"px";
    requestAnimationFrame(()=>el.classList.remove("ro-fade"));
    const t0=performance.now();const f=()=>{onFrame?.();if(performance.now()-t0<RO_MS+20)requestAnimationFrame(f);else{el.style.height="";el.style.overflow="";el.style.transition="";el.classList.remove("ro-anim");done?.()}};requestAnimationFrame(f)},RO_FADE)}
document.addEventListener("pointerdown",ev=>{const h=ev.target.closest("[data-drag]");if(!h)return;const c=S.clients[S.clientId];if(!c)return;
  const stack=h.closest(".stack");const blocks=[...stack.querySelectorAll(":scope>.gblock")];if(blocks.length<2)return;ev.preventDefault();
  const from=+h.dataset.drag,el=blocks[from];try{h.setPointerCapture(ev.pointerId)}catch(e){}
  let y=ev.clientY,to=from,timer=null,ready=false,ended=false,nat=null,H=0,STEP=0,minC=-1e9,maxC=1e9,dy=0;
  document.body.classList.add("dragmode");el.classList.add("dragging");try{navigator.vibrate?.(15)}catch(e){}
  /* zona permitida: del primer al último bloque */
  const lim=()=>{const sy=window.scrollY;const f=blocks[0].getBoundingClientRect(),l=blocks[blocks.length-1].getBoundingClientRect();const q=el.getBoundingClientRect();const hh=q.height;
    const top=Math.min(f.top,q.top-dy)+sy,bot=Math.max(l.bottom,q.bottom-dy)+sy;return[top+hh/2,bot-hh/2]};
  /* el agarre (los puntitos) se queda bajo el dedo: guardamos la distancia del dedo a la orilla de arriba del bloque */
  const offTop=Math.max(12,ev.clientY-el.getBoundingClientRect().top);
  const follow=()=>{const q=el.getBoundingClientRect();const natTop=q.top-dy;const ot=Math.min(offTop,q.height-12);const [a,b]=lim();
    const c2=Math.min(b,Math.max(a,y+window.scrollY-ot+q.height/2))-window.scrollY;
    dy=c2-(natTop+q.height/2);el.style.transform=`translateY(${dy}px) scale(1.03)`};
  follow();
  roResize(el,true,()=>{if(!ended)follow()},()=>{if(ended)return;start()});
  function start(){const sy=window.scrollY;
    nat=blocks.map((b,i)=>{const q=b.getBoundingClientRect();return{top:q.top+sy-(i===from?dy:0),h:q.height}});H=nat[from].h;
    const G=from<blocks.length-1?nat[from+1].top-(nat[from].top+H):nat[from].top-(nat[from-1].top+nat[from-1].h);STEP=H+G;
    minC=Math.min(...nat.map(x=>x.top))+H/2;maxC=Math.max(...nat.map(x=>x.top+x.h))-H/2;
    el.style.transition="none";stack.classList.add("ro-live");ready=true;place();timer=setInterval(tick,30)}
  function place(){if(!ready)return follow();const center=Math.min(maxC,Math.max(minC,y+window.scrollY-Math.min(offTop,H-12)+H/2));
    dy=center-(nat[from].top+H/2);el.style.transform=`translateY(${dy}px) scale(1.03)`;
    let n=0;blocks.forEach((b,i)=>{if(i!==from&&center>nat[i].top+nat[i].h/2)n++});to=n;
    blocks.forEach((b,i)=>{if(i===from)return;let d=0;if(from<to&&i>from&&i<=to)d=-STEP;else if(to<from&&i>=to&&i<from)d=STEP;b.style.transform=d?`translateY(${d}px)`:""})}
  function tick(){const m=80;const r=stack.getBoundingClientRect();
    if(y<m&&r.top<m)window.scrollBy(0,-12);else if(y>innerHeight-m&&r.bottom>innerHeight-m)window.scrollBy(0,12);place()}
  const mv=e=>{y=e.clientY;place()};
  const up=()=>{ended=true;clearInterval(timer);h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
    const moving=ready&&to!==from;const visC=(el.getBoundingClientRect().top+el.getBoundingClientRect().bottom)/2;
    blocks.forEach(b=>{b.style.transform="";b.style.transition=""});stack.classList.remove("ro-live");document.body.classList.remove("dragmode");
    let target=el;
    if(moving){const d=c.routine[dk(c)];const groups=groupsOf(d.exercises);const g=groups.splice(from,1)[0];groups.splice(to,0,g);d.exercises=groups.flat().map(i=>d.exercises[i]);
      render();saveRoutine(c).then(()=>toast("Orden actualizado"));
      target=[...document.querySelectorAll(".stack>.gblock")][to];if(!target)return;target.classList.add("mini","dragging")}
    {const q=target.getBoundingClientRect();window.scrollBy(0,(q.top+q.height/2)-visC)}
    /* crecer de vuelta: desvanecer, cambiar de alto suave y mostrar el contenido completo */
    roResize(target,false,null,()=>{target.classList.remove("dragging");target.classList.add("justdropped");setTimeout(()=>target.classList.remove("justdropped"),450)})};
  h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up)});

/* Biseries: un ejercicio con ss=true se hace junto con el siguiente */
function evenGroups(exs,setsKey,restKey){/* exs: array con .ss; iguala series y deja descanso 0 salvo el último de cada biserie/triserie */
  groupsOf(exs).forEach(g=>{if(g.length<2)return;const first=exs[g[0]];const last=exs[g[g.length-1]];
    const rest=String(parseInt(last[restKey],10)||Math.max(...g.map(i=>parseInt(exs[i][restKey],10)||0))||"");
    g.forEach((i,k)=>{exs[i][setsKey]=first[setsKey];exs[i][restKey]=k<g.length-1?"0":rest})})}

  for(let r=0;r<rounds;r++)g.forEach(i=>{if(r<setsOf(exs[i]))plan.push({ei:i,si:r,g:gi})})});return plan}
function groupOfEx(p,ei){return groupsOf(p.exercises).find(g=>g.includes(ei))}
function step(p){return p.plan[p.k]||p.plan[p.plan.length-1]}
const skey=s=>s.ei+"-"+s.si;
function stepDone(p,s){return !!p.results[s.ei]?.[s.si]||!!p.sskip?.[skey(s)]}

function frontierK(p){let last=-1;p.plan.forEach((s,k)=>{if(stepDone(p,s))last=k});return nextPending(p,last+1)}
function nextK(p,from){let k=from;while(k<p.plan.length&&p.skipped[p.plan[k].ei])k++;return k}
function nextNavK(p,from){let k=from;while(k<p.plan.length&&p.skipped[p.plan[k].ei])k++;return k<p.plan.length?k:-1}
function prevK(p,from){let k=from;while(k>=0&&p.skipped[p.plan[k].ei])k--;return k}

async function wakeOn(){if(document.visibilityState!=="visible")return;
  if("wakeLock" in navigator){try{if(!wlk){wlk=await navigator.wakeLock.request("screen");wlk.addEventListener("release",()=>{wlk=null})}return}catch(e){}}

const PLATES=[45,35,25,10,5,2.5];
const PL={45:{c:"var(--p45)",t:"#fff",w:17,h:96,b:58},35:{c:"var(--p35)",t:"#1a1a1a",w:15,h:86,b:54},25:{c:"var(--p25)",t:"#fff",w:13,h:74,b:50},
  10:{c:"var(--p10)",t:"#fff",w:10,h:56,b:44},5:{c:"var(--p5)",t:"#fff",w:8,h:44,b:40},2.5:{c:"var(--p2)",t:"#1a1a1a",w:7,h:34,b:36}};
const BARS=[[45,"Barra 45"],[35,"Barra 35"],[25,"Barra Z 25"],[0,"Sin barra"]];
function libMatch(e){const k=exKey(e?.name);return k?Object.values(S.library).find(x=>exKey(x.name)===k):null}
function loadFor(e){if(e?.load!==undefined)return e.load||"";return libMatch(e)?.load||""}
function barFor(e,ld){ld=ld||loadFor(e);if(NO_BAR(ld))return 0;const v=e?.bar!=null&&e.bar!==""?e.bar:libMatch(e)?.bar;if(v!=null&&v!=="")return num(v);return(ld||loadFor(e))==="plates2"?45:0}
function multOf(e){return e.load==="plates1"?1:2}
function greedyPlates(totalLb,bar,mult){let side=(totalLb-bar)/mult;const out=[];if(!(side>0))return out;
  for(const w of PLATES){while(side>=w-0.01&&out.length<12){out.push(w);side-=w}}return out}
function plateTotal(p,ei){const e=p.exercises[ei];return(p.bars[ei]||0)+(p.plates[ei]||[]).reduce((a,b)=>a+b,0)*multOf(e)}
function plateBreak(p,ei){const e=p.exercises[ei],pl=p.plates[ei]||[];const cnt={};pl.forEach(w=>cnt[w]=(cnt[w]||0)+1);
  const parts=PLATES.filter(w=>cnt[w]).map(w=>`${cnt[w]}×${w}`);
  const side=parts.length?parts.join(" + "):"sin discos";
  return (p.bars[ei]?`Barra ${p.bars[ei]} + `:"")+(multOf(e)===2?`(${side}) ${e.load==="hammer"?"por brazo":"por lado"}`:`${side} de un lado`)}
const NO_BAR=l=>l==="smith"||l==="hammer";
const EQUIP_TYPES=[["db","Mancuernas"],["fixbar","Barra de peso fijo"]];
const isEquip=v=>v==="db"||v==="fixbar";
function equipOf(e){if(e?.equip!==undefined)return e.equip||"";return libMatch(e)?.equip||""}

const LOAD_TYPES=[["","Peso directo"],["plates2","Discos · barra libre"],["smith","Discos · Smith"],["hammer","Discos · máquina tipo Hammer"],["plates1","Discos · un lado (remo T)"]];
function barSVG(p,ei){
  const e=p.exercises[ei],pl=p.plates[ei]||[],type=e.load||"plates2";
  const W=360,H=type==="smith"||type==="hammer"?160:110;
  /* discos: start = borde del collarín, dir = hacia afuera, sc = escala de altura */
  const rects=(start,dir,cy,room,sc)=>{const need=pl.reduce((a,w)=>a+PL[w].w+2,0);const k=need>room?room/need:1;let x=start,out="";
    pl.forEach((w,i)=>{const P=PL[w],pw=Math.max(4,P.w*k),ph=P.h*sc;const rx=dir>0?x:x-pw;
      out+=`<g data-rmplate="${i}" style="cursor:pointer"><rect x="${rx}" y="${cy-ph/2}" width="${pw}" height="${ph}" rx="2.5" fill="${P.c}" stroke="var(--surface)" stroke-width="1"/>
      ${pw>=11&&ph>=40?`<text x="${rx+pw/2}" y="${cy}" fill="${P.t}" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 ${rx+pw/2} ${cy})">${w}</text>`:""}</g>`;x+=dir*(pw+2)});return out};
  const barbell=cy=>`<rect x="6" y="${cy-4}" width="${W-12}" height="8" rx="3" fill="var(--bar)"/>
    <rect x="8" y="${cy-7}" width="112" height="14" rx="3" fill="var(--sleeve)"/><rect x="240" y="${cy-7}" width="112" height="14" rx="3" fill="var(--sleeve)"/>
    <rect x="120" y="${cy-13}" width="6" height="26" rx="2" fill="var(--bar)"/><rect x="234" y="${cy-13}" width="6" height="26" rx="2" fill="var(--bar)"/>`;
  let g="";
  if(type==="smith"){const cy=78;
    /* marco: base, dos rieles verticales, travesaño; la barra corre por los rieles con sus ganchos */
    g+=`<rect x="96" y="150" width="168" height="5" rx="2" fill="var(--frame)"/><rect x="88" y="146" width="22" height="9" rx="2" fill="var(--frame)"/><rect x="250" y="146" width="22" height="9" rx="2" fill="var(--frame)"/>
      <rect x="128" y="10" width="104" height="6" rx="2" fill="var(--frame)"/>
      <rect x="138" y="10" width="5" height="142" rx="2" fill="var(--frame)"/><rect x="217" y="10" width="5" height="142" rx="2" fill="var(--frame)"/>`;
    g+=barbell(cy)+`<rect x="133" y="${cy-12}" width="15" height="24" rx="3" fill="var(--bar)"/><rect x="212" y="${cy-12}" width="15" height="24" rx="3" fill="var(--bar)"/>
      <path d="M148 ${cy+2}h6v8" stroke="var(--bar)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M212 ${cy+2}h-6v8" stroke="var(--bar)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    g+=rects(117,-1,cy,104,1)+rects(243,1,cy,104,1);
  }else if(type==="hammer"){
    /* dos brazos paralelos: pivote a la izquierda, agarre, y el cuerno donde van los discos */
    [44,116].forEach((cy,j)=>{
      g+=`<circle cx="26" cy="${cy}" r="9" fill="none" stroke="var(--frame)" stroke-width="4"/><circle cx="26" cy="${cy}" r="3" fill="var(--frame)"/>
        <rect x="34" y="${cy-5}" width="160" height="10" rx="4" fill="var(--bar)"/>
        <rect x="96" y="${cy-18}" width="7" height="22" rx="3" fill="var(--sleeve)"/>
        <rect x="200" y="${cy-6}" width="150" height="12" rx="3" fill="var(--sleeve)"/><rect x="194" y="${cy-12}" width="6" height="24" rx="2" fill="var(--bar)"/>
        <text x="48" y="${cy-12}" font-size="10" fill="var(--muted)">${j?"brazo der.":"brazo izq."}</text>`;
      g+=rects(203,1,cy,144,.64);});
  }else if(type==="plates1"){const cy=55;
    g+=`<rect x="6" y="${cy-4}" width="${W-12}" height="8" rx="3" fill="var(--bar)"/><rect x="186" y="${cy-7}" width="166" height="14" rx="3" fill="var(--sleeve)"/><rect x="180" y="${cy-13}" width="6" height="26" rx="2" fill="var(--bar)"/>
      <rect x="20" y="${cy-14}" width="10" height="28" rx="3" fill="var(--bar)"/><text x="40" y="${cy-18}" font-size="10" fill="var(--muted)">anclaje</text>`+rects(189,1,cy,158,1);
  }else{const cy=55;
    g+=barbell(cy)+`<rect x="150" y="${cy-4}" width="60" height="8" fill="url(#knurl)"/>`+rects(117,-1,cy,104,1)+rects(243,1,cy,104,1);

async function saveWorkout(p,o={}){
  const auto=!!o.auto;const btn=auto?null:$("#pl-save");const fail=()=>{if(btn){btn.disabled=false;btn.textContent="Reintentar guardar"}};
  if(btn){btn.disabled=true;btn.textContent="Guardando…"}
  if(auto)p.autoEnd=true;
  /* la fecha es la del día en que EMPEZÓ la rutina, aunque se guarde después de medianoche */
  const date=isoD(new Date(p.startedAt||Date.now()));
  if(!p.sessionSaved){const st=stats(p);
    const ok=await save("sessions/w"+uid(),{clientId:p.clientId,date,day:p.day,title:p.title||p.dayName,energyStart:p.energyStart||"",energyEnd:p.energyEnd||"",
      cardio:{machine:p.cardio?.machine||"",min:p.cardio?.min||"",km:p.cardio?.km||""},cardioPlan:p.cardioPlan||null,notes:(p.notes||"").trim(),minutes:st.min,sets:st.sets,volumeKg:st.vol,feel:st.f,startedAt:p.startedAt||0,...(auto?{auto:true}:{}),...(p.dl?{dl:true}:{}),...progPayloadP(p),createdAt:Date.now()});
    if(!ok){fail();return false}p.sessionSaved=true;persist()}
  for(let i=0;i<p.exercises.length;i++){const sets=p.results[i].filter(Boolean);if(!sets.length)continue;
    const note=(p.exNotes?.[i]||"").trim();const ok=await save("logs/g"+uid(),{clientId:p.clientId,date,day:p.day,exName:p.exercises[i].name,sets,base:{w:baseW(p.exercises[i]),reps:p.exercises[i].reps||""},...(p.energyStart?{en:p.energyStart}:{}),...(p.dl?{dl:true}:{}),...(note?{note}:{}),createdAt:Date.now()});
    if(!ok){fail();return false}
    p.results[i]=p.results[i].map(()=>null);persist(); /* lo ya guardado no se duplica si reintentas */
  }
  const name=p.clientName;
  if(auto){endSession(p.clientId);if(!OPEN)render();return true}
  S.progClient=p.clientId;endSession(p.clientId);toast(`Entrenamiento de ${name} guardado`);
  if(!OPEN){S.tab="progreso";S.progEx=null;S.clientId=null;window.scrollTo(0,0);render()}
  return true
}
/* ---- Cierre automático: a las 11 pm del día en que empezó, toda rutina abierta se guarda como terminada ese día ---- */
function closeAt(t){const d=new Date(t);d.setHours(23,0,0,0);return t>=d.getTime()?t+4*3600e3:d.getTime()}
let autoBusy=false;
async function autoClose(){
  if(autoBusy||!S.db||!S.loaded.sessions||!S.loaded.clients)return;autoBusy=true;
  try{
    const now=Date.now();
    /* rutinas que solo existen en el teléfono del cliente (no sincronizadas aquí) */
    Object.values(LIVE).forEach(d=>{if(!W[d.clientId]&&d.startedAt&&now>=closeAt(d.startedAt)){W[d.clientId]=fromLive(d,null)}});
    for(const p of sessions()){if(!p.startedAt||now<closeAt(p.startedAt))continue;
      const cid=p.clientId,dia=new Date(p.startedAt).toLocaleDateString("es-MX",{weekday:"long"});
      const dup=Object.values(S.sessions).some(x=>x.clientId===cid&&x.startedAt&&x.startedAt===p.startedAt);
      if(dup||!doneSets(p)){endSession(cid);if(!dup)toast(`Se cerró la rutina del ${dia} de ${p.clientName} (no tenía series)`);continue}
      if(await saveWorkout(p,{auto:true}))toast(`Se cerró y guardó la rutina del ${dia} de ${p.clientName}`)}
  }finally{autoBusy=false}
}
